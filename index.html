<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="服药记录">
<meta name="theme-color" content="#16256a">
<title>服药记录</title>
<style>
:root{--bg:#f3f5f9;--card:#fff;--ink:#1a2233;--mute:#6b7685;--line:#e3e7ee;--accent:#4a6cf7;--accent2:#7c5cff;--warn:#c2410c;--warn-soft:#fff1e6;--ok:#1f9d74;--info-soft:#e8efff;--info:#2f55d4}
@media(prefers-color-scheme:dark){:root{--bg:#0d1118;--card:#171c26;--ink:#e9edf5;--mute:#98a3b5;--line:#262d3a;--accent:#7b93ff;--accent2:#a48bff;--warn:#fb923c;--warn-soft:#3a2616;--ok:#46d6a4;--info-soft:#18274a;--info:#9db4ff}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC",sans-serif;padding:calc(12px + env(safe-area-inset-top)) 14px calc(96px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
h1{font-size:19px;margin:4px 2px 12px;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.card h2{font-size:14px;margin:0 0 10px;color:var(--mute);font-weight:600;letter-spacing:.3px}
.alert{background:var(--warn-soft);color:var(--warn);border-radius:14px;padding:10px 12px;margin-bottom:10px;font-weight:600;font-size:14px}
.info{background:var(--info-soft);color:var(--info);border-radius:14px;padding:10px 12px;margin-bottom:10px;font-weight:600;font-size:14px}
.sync{font-size:12px;color:var(--mute);margin:-2px 2px 8px;text-align:right}
input,button,select,textarea{font:inherit;color:inherit}
input[type=time],input[type=date],input[type=text],input[type=password],select{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
button{border:0;border-radius:12px;padding:10px 16px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-weight:600;cursor:pointer}
button:disabled{opacity:.5}
button.ghost{background:var(--bg);color:var(--ink);border:1px solid var(--line);font-weight:500}
button.small{padding:7px 12px;font-size:14px;border-radius:10px}
button.big{width:100%;padding:14px;font-size:17px;margin-top:12px;border-radius:14px}
.line{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.line label{color:var(--mute);font-size:14px}
.note{font-size:13px;color:var(--mute)}
.done{color:var(--ok);font-weight:600}
.miss{color:var(--warn)}
textarea{width:100%;height:150px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px;font-size:12px}
hr.sep{border:0;border-top:1px solid var(--line);margin:14px 0}

/* sky hero */
.sky{position:relative;border-radius:24px;overflow:hidden;color:#fff;padding:14px 14px 16px;margin-bottom:12px;box-shadow:0 8px 24px rgba(20,30,90,.28)}
.sky .bgs{position:absolute;border-radius:50%;background:#fff;animation:tw 3.2s ease-in-out infinite}
.sky>*{position:relative}
.sky .hrow{display:flex;justify-content:space-between;align-items:center;min-height:30px}
.chipS{display:inline-block;padding:4px 11px;border-radius:14px;background:rgba(255,255,255,.16);backdrop-filter:blur(4px);font-size:13px}
.moon{font-size:28px;animation:float 5s ease-in-out infinite}
.csvg{margin:2px -4px 0}
.csvg svg{width:100%;height:auto;max-height:190px;display:block;overflow:visible}
.hcap{display:flex;justify-content:space-between;align-items:baseline;margin-top:2px}
.hcap b{font-size:17px}
.hcap span{font-size:13px;opacity:.85}
.energy{display:flex;gap:6px;margin:10px 0 8px}
.energy i{flex:1;height:8px;border-radius:6px;background:rgba(255,255,255,.18);overflow:hidden;position:relative}
.energy i.on{background:var(--star);box-shadow:0 0 10px var(--star)}
.hmsg{font-size:14px;opacity:.95;line-height:1.5}
.sky .shoot{position:absolute;width:90px;height:2px;background:linear-gradient(90deg,rgba(255,255,255,0),#fff);border-radius:2px;opacity:0;transform:rotate(-28deg);animation:shoot 7s linear infinite}
.sky .auroraL{position:absolute;left:-20%;right:-20%;top:10%;height:55%;background:linear-gradient(100deg,rgba(80,255,180,.0),rgba(80,255,180,.28),rgba(120,140,255,.28),rgba(255,120,220,.0));filter:blur(22px);animation:aur 9s ease-in-out infinite alternate;pointer-events:none}
.sky .fly{position:absolute;width:5px;height:5px;border-radius:50%;background:#ffef9a;box-shadow:0 0 8px 2px rgba(255,239,154,.8);animation:fl 7s ease-in-out infinite}
.sky .flake{position:absolute;top:-8px;width:5px;height:5px;border-radius:50%;background:#fff;opacity:.85;animation:snowf 7s linear infinite}
.pulse{animation:glow 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.ignite{animation:ign 1.4s ease-out}
.tdy{animation:ringp 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}

/* stats */
.stats{display:flex;gap:8px;margin-bottom:12px}
.stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 6px;text-align:center}
.stat b{display:block;font-size:20px}
.stat span{font-size:12px;color:var(--mute)}

/* orbs */
.orbs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.orbc{background:var(--bg);border:1px solid var(--line);border-radius:18px;padding:12px 8px 10px;text-align:center}
.orbc.off{opacity:.5}
.orbc.got{background:var(--card);border-style:dashed}
.orb{width:60px;height:60px;border-radius:50%;margin:0 auto 6px;display:flex;align-items:center;justify-content:center;font-size:28px;box-shadow:inset -6px -8px 14px rgba(0,0,0,.14),0 4px 10px rgba(0,0,0,.14);animation:float 3s ease-in-out infinite}
.orbc.got .orb{animation:none;opacity:.6;filter:saturate(.4)}
.orbc.pop .orb{animation:pop .6s ease-out}
.orbc b{display:block;font-size:15px}
.orbc small{display:block;color:var(--mute);font-size:12px;margin-bottom:6px;min-height:16px}
.orbc input[type=time]{width:100%;margin-bottom:6px;text-align:center}
.orbc button{width:100%}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 4px}
.chip{padding:7px 12px;border-radius:20px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-size:14px}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}

/* sky tab */
.consgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cc{border-radius:16px;overflow:hidden;position:relative;color:#fff;cursor:pointer;padding:8px 8px 10px}
.cc.future{opacity:.45}
.cc.perfect{box-shadow:0 0 0 2px #ffd86b inset,0 0 14px rgba(255,216,107,.5)}
.cc.cur{box-shadow:0 0 0 2px rgba(255,255,255,.7) inset}
.cc svg{width:100%;height:auto;display:block}
.cc .cn{display:flex;justify-content:space-between;font-size:13px;margin-top:2px}
.cc .cn b{font-size:14px}
.themeg{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.ti{min-width:68px;padding:8px 8px 6px;border-radius:14px;border:1px solid var(--line);background:var(--bg);text-align:center;cursor:pointer;font-size:12px}
.ti .pv{display:flex;height:30px;align-items:center;justify-content:center;font-size:22px;margin-bottom:2px}
.ti.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.ti.lock{opacity:.4;cursor:default}
.sw{display:inline-block;width:42px;height:26px;border-radius:8px;border:1px solid rgba(255,255,255,.3)}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}

/* logs */
.day{border-top:1px solid var(--line);padding:10px 0}
.day:first-of-type{border-top:0}
.day h3{margin:0 0 4px;font-size:15px;display:flex;justify-content:space-between}
.day h3 em{font-style:normal;font-size:13px;color:var(--mute)}
.dose{display:flex;justify-content:space-between;font-size:14px;color:var(--mute);padding:2px 0}
.dose button{padding:0 6px;background:none;color:var(--mute);font-size:16px}
.appt{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:15px}
.appt.past{color:var(--mute);text-decoration:line-through}
.appt button{padding:0 6px;background:none;color:var(--mute);font-size:16px}
.sym h4{margin:12px 0 4px;font-size:14px}
.sym label{display:flex;gap:8px;align-items:flex-start;padding:5px 0;font-size:15px}
.sym input[type=checkbox]{margin-top:4px;width:18px;height:18px}

/* tab bar */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:center;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 40%)}
#tabs .tb{display:flex;width:100%;max-width:536px;background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:0 8px 24px rgba(10,20,60,.16);overflow:hidden}
#tabs button{flex:1;background:none;color:var(--mute);border-radius:0;padding:9px 0 8px;font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px}
#tabs button span{font-size:20px;line-height:1}
#tabs button.on{color:var(--accent)}

/* overlays */
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top));transform:translateX(-50%);background:#141a2e;color:#fff;padding:9px 16px;border-radius:20px;font-weight:600;z-index:60;animation:toast 2s ease forwards;white-space:nowrap}
.cf{position:fixed;z-index:55;pointer-events:none;animation:rise 2s ease-out forwards;font-weight:700}
.ov{position:fixed;inset:0;background:rgba(5,8,25,.62);z-index:70;display:flex;align-items:center;justify-content:center;padding:18px}
.modal{background:var(--card);color:var(--ink);border-radius:22px;padding:22px 18px;max-width:360px;width:100%;text-align:center;animation:pop .45s ease-out;max-height:90vh;overflow:auto}
.modal .big1{font-size:52px}
.modal h3{margin:6px 0 8px}
.modal p{margin:6px 0;font-size:15px}
.mdark{background:var(--sky-bg,#16256a);color:#fff}

@keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes glow{0%,100%{opacity:.18;transform:scale(1)}50%{opacity:.5;transform:scale(1.25)}}
@keyframes ign{0%{transform:scale(.2);opacity:0}40%{transform:scale(2.4);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes ringp{0%,100%{opacity:.9;transform:scale(1)}50%{opacity:.35;transform:scale(1.5)}}
@keyframes shoot{0%{opacity:0;transform:translate(0,0) rotate(-28deg)}4%{opacity:1}14%{opacity:0;transform:translate(-190px,100px) rotate(-28deg)}100%{opacity:0}}
@keyframes aur{0%{transform:translateX(-6%) skewX(-4deg);opacity:.7}100%{transform:translateX(6%) skewX(4deg);opacity:1}}
@keyframes fl{0%,100%{transform:translate(0,0);opacity:.2}25%{transform:translate(14px,-18px);opacity:1}50%{transform:translate(-8px,-34px);opacity:.4}75%{transform:translate(12px,-14px);opacity:1}}
@keyframes snowf{to{transform:translate(18px,300px)}}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-10px)}12%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-6px)}}
@keyframes rise{0%{opacity:1;transform:translate(0,0) scale(.6)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.3) rotate(var(--rot))}}
@media(prefers-reduced-motion:reduce){.sky .bgs,.moon,.orb,.sky .shoot,.sky .auroraL,.sky .fly,.sky .flake,.pulse,.tdy,.ignite{animation:none!important}.cf{display:none}}
</style>
</head>
<body>
<h1>💊 服药记录</h1>
<div id="app"></div>
<div id="tabs"></div>
<script>
(function(){
var REPO='keirama370/pill-data', FILE='data.json', BRANCH='main';
var LS_STATE='pill.state', LS_TOKEN='pill.token', LS_SHA='pill.sha', LS_MANUAL='pill.manual';
var WDN=['','一','二','三','四','五','六','日'];

function pad(n){return String(n).padStart(2,'0');}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function nowHM(){var d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes());}
function parseD(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function dayDiff(a,b){return Math.round((parseD(b)-parseD(a))/86400000);}
function addDays(s,n){var d=parseD(s);d.setDate(d.getDate()+n);return ymd(d);}
function uid(){return 'l'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function clone(o){return JSON.parse(JSON.stringify(o));}
function ls(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}

var today=ymd(new Date());
var selDate=today;
var busy='';
var syncMsg='',syncDetail='';
var syncing=false,syncAgain=false;
var token=ls(LS_TOKEN)||'';
var manualPlace=ls(LS_MANUAL)||'家';
var symDraft=null;
var summaryText='';

/* ---------- data model ---------- */
function defaultDrugs(){return [
 {id:'d1',name:'贝达喹啉',en:'Bedaquiline',time:'08:00',sched:[{from:1,to:14,dose:'400毫克'},{from:15,dose:'200毫克',wd:[1,3,5]}]},
 {id:'d2',name:'普托马尼',en:'Pretomanid',time:'08:00',sched:[{from:1,dose:'200毫克'}]},
 {id:'d3',name:'利奈唑胺',en:'Linezolid',time:'08:00',sched:[{from:1,dose:'600毫克'}]},
 {id:'d4',name:'莫西沙星',en:'Moxifloxacin',time:'08:00',sched:[{from:1,dose:'400毫克'}]}];}
function defaults(){return {v:2,settingsAt:0,updatedAt:0,start:today,days:182,drugs:defaultDrugs(),sky:{palette:'ocean',star:'dot',line:'plain',moon:'none',title:'启程者',fx:[]},places:[],logs:[],symptoms:[],appts:[],deleted:[]};}
function migrate(s){
  if(!s)return s;
  if((s.v||1)<2){
    var d0=defaultDrugs();
    (s.drugs||[]).forEach(function(d,i){if(d0[i]&&d.time)d0[i].time=d.time;});
    s.drugs=d0;if(s.days===180)s.days=182;s.v=2;s.settingsAt=Date.now();
  }
  ['places','logs','symptoms','appts','deleted'].forEach(function(k){if(!s[k])s[k]=[];});
  if(!s.sky)s.sky={palette:'ocean',star:'dot',line:'plain',moon:'none',title:'启程者',fx:[]};
  delete s.pet;
  return s;
}
var state=defaults();
try{var raw=ls(LS_STATE);if(raw)state=migrate(Object.assign(defaults(),JSON.parse(raw)));}catch(e){}
lsSet(LS_STATE,JSON.stringify(state));

function touch(settings){var t=Date.now();state.updatedAt=t;if(settings)state.settingsAt=t;lsSet(LS_STATE,JSON.stringify(state));}

/* ---------- schedule rules ---------- */
function dayNo(date){return dayDiff(state.start,date)+1;}
function wdOf(date){return (parseD(date).getDay()+6)%7+1;}
function phaseFor(d,n){var ph=null;(d.sched||[]).forEach(function(p){if(n>=p.from&&(p.to==null||n<=p.to))ph=p;});return ph;}
function dueInfo(d,date){
  var n=dayNo(date);if(n<1||n>state.days)return null;
  var ph=phaseFor(d,n);if(!ph)return null;
  if(ph.wd&&ph.wd.indexOf(wdOf(date))<0)return null;
  return {dose:ph.dose};
}
function dueDrugs(date){return state.drugs.filter(function(d){return dueInfo(d,date);});}
function logsFor(date,drugId){return state.logs.filter(function(l){return l.date===date&&(!drugId||l.drug===drugId);});}
function isFull(date){var dd=dueDrugs(date);return dd.length>0&&dd.every(function(d){return logsFor(date,d.id).length>0;});}
function drugName(id){var d=state.drugs.filter(function(x){return x.id===id;})[0];return d?d.name:'(已删除)';}
function ruleText(d,date){
  var ph=phaseFor(d,dayNo(date));if(!ph)return '';
  return ph.wd?('每周'+ph.wd.map(function(x){return WDN[x];}).join('、')+'，每次'+ph.dose):('每天，每次'+ph.dose);
}
function endDate(){return addDays(state.start,state.days-1);}

/* ---------- sync with GitHub ---------- */
function b64enc(s){return btoa(unescape(encodeURIComponent(s)));}
function b64dec(s){return decodeURIComponent(escape(atob(s.replace(/\n/g,''))));}
function api(method,body){
  return fetch('https://api.github.com/repos/'+REPO+'/contents/'+FILE+(method==='GET'?'?ref='+BRANCH+'&t='+Date.now():''),{
    method:method,cache:'no-store',
    headers:{'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'},
    body:body?JSON.stringify(body):undefined});
}
function cmp(a,b){return a<b?-1:a>b?1:0;}
function norm(s){
  return {v:2,settingsAt:s.settingsAt||0,updatedAt:s.updatedAt||0,start:s.start,days:s.days,drugs:s.drugs,sky:s.sky||{palette:'ocean',star:'dot',line:'plain',moon:'none',title:'启程者',fx:[]},
    places:(s.places||[]).slice().sort(function(a,b){return cmp(a.name,b.name);}),
    logs:(s.logs||[]).slice().sort(function(a,b){return cmp(a.date+a.time+a.id,b.date+b.time+b.id);}),
    symptoms:(s.symptoms||[]).slice().sort(function(a,b){return cmp(a.date,b.date);}),
    appts:(s.appts||[]).slice().sort(function(a,b){return cmp(a.date+a.id,b.date+b.id);}),
    deleted:(s.deleted||[]).slice().sort()};
}
function merge(a,b){
  if(!b)return norm(a);
  var base=(b.settingsAt||0)>(a.settingsAt||0)?b:a;
  var del={};(a.deleted||[]).concat(b.deleted||[]).forEach(function(i){del[i]=1;});
  var pm={};(a.places||[]).concat(b.places||[]).forEach(function(p){pm[p.name]=p;});
  var lm={};(a.logs||[]).concat(b.logs||[]).forEach(function(l){if(del[l.id])return;var o=lm[l.id];if(!o||(l.place&&!o.place))lm[l.id]=l;});
  var sm={};(a.symptoms||[]).concat(b.symptoms||[]).forEach(function(x){var o=sm[x.id];if(!o||(x.updatedAt||0)>(o.updatedAt||0))sm[x.id]=x;});
  var am={};(a.appts||[]).concat(b.appts||[]).forEach(function(x){if(!del[x.id])am[x.id]=x;});
  var vals=function(m){return Object.keys(m).map(function(k){return m[k];});};
  return norm({settingsAt:base.settingsAt,updatedAt:Math.max(a.updatedAt||0,b.updatedAt||0),start:base.start,days:base.days,drugs:clone(base.drugs),sky:clone(base.sky||{palette:'ocean',star:'dot',line:'plain',moon:'none',title:'启程者',fx:[]}),
    places:vals(pm),logs:vals(lm),symptoms:vals(sm),appts:vals(am),deleted:Object.keys(del)});
}
function same(a,b){return JSON.stringify(norm(a))===JSON.stringify(norm(b));}
async function failText(r){var t='';try{var j=await r.json();t=j.message||'';}catch(e){}return 'http '+r.status+(t?' '+t:'');}

async function doSync(){
  if(!token){syncMsg='no-token';render();return;}
  if(syncing){syncAgain=true;return;}
  syncing=true;syncMsg='syncing';syncDetail='';render();
  try{
    for(var attempt=0;attempt<3;attempt++){
      var r=await api('GET'),remote=null,rsha=null;
      if(r.status===401||r.status===403){throw new Error('auth');}
      if(r.status===404){remote=null;rsha=null;}
      else if(!r.ok){throw new Error(await failText(r));}
      else{var j=await r.json();remote=migrate(JSON.parse(b64dec(j.content)));rsha=j.sha;}
      var merged=merge(state,remote);
      var needPush=!remote||!same(merged,remote);
      state=merged;lsSet(LS_STATE,JSON.stringify(state));
      if(!needPush){syncMsg='ok';break;}
      var body={message:'update '+new Date().toISOString(),content:b64enc(JSON.stringify(state,null,1)),branch:BRANCH};
      if(rsha)body.sha=rsha;
      var pr=await api('PUT',body);
      if(pr.status===409||pr.status===422){continue;}
      if(pr.status===401||pr.status===403){throw new Error('auth');}
      if(!pr.ok){throw new Error(await failText(pr));}
      syncMsg='ok';break;
    }
    if(syncMsg==='syncing')syncMsg='fail';
  }catch(e){syncMsg=(e&&e.message==='auth')?'auth':'fail';syncDetail=(e&&e.message)||'';}
  syncing=false;
  if(syncAgain){syncAgain=false;return doSync();}
  render();
}

/* ---------- location ---------- */
function getPos(){
  return new Promise(function(res,rej){
    if(!navigator.geolocation){rej(new Error('nogeo'));return;}
    navigator.geolocation.getCurrentPosition(function(p){res({lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy});},
      function(e){rej(e);},{enableHighAccuracy:true,timeout:10000,maximumAge:60000});
  });
}
function distM(a,b){
  var R=6371000,t=Math.PI/180;
  var dLat=(b.lat-a.lat)*t,dLng=(b.lng-a.lng)*t;

  sc.appendChild(el('h2',{text:'给医生看的汇总'}));
  var sta=el('textarea',{readonly:'readonly',style:'height:220px'});sta.value=summaryText;
  sc.appendChild(el('div',{class:'line'},[
    el('button',{text:'生成汇总',onclick:function(){summaryText=buildSummary();render();}}),
    summaryText?el('button',{class:'ghost',text:'复制',onclick:function(){try{navigator.clipboard.writeText(summaryText).catch(function(){sta.select();});}catch(e){sta.select();}}}):null
  ]));
  if(summaryText)sc.appendChild(sta);
  box.appendChild(sc);

  var hist=el('div',{class:'card'});
  hist.appendChild(el('h2',{text:'历史记录'}));
  var list=[],seen={},elapsed=Math.max(1,Math.min(state.days,dayNo(today)));
  for(var i=0;i<elapsed;i++){var dd=addDays(state.start,i);list.push(dd);seen[dd]=1;}
  state.logs.forEach(function(l){if(!seen[l.date]){seen[l.date]=1;list.push(l.date);}});
  list.sort().reverse();
  if(!state.logs.length)hist.appendChild(el('div',{class:'note',text:'还没有记录。'}));
  list.forEach(function(date){
    var ls_=logsFor(date).sort(function(a,b){return cmp(a.time,b.time);});
    if(!ls_.length&&date===today)return;
    var full=isFull(date),dueN=dueDrugs(date).length,day=el('div',{class:'day'});
    day.appendChild(el('h3',{},[date+(date===today?'（今天）':''),el('em',{class:full?'done':'miss',text:full?'✦ 吃齐':(ls_.length+'/'+dueN)})]));
    ls_.forEach(function(l){day.appendChild(el('div',{class:'dose'},[el('span',{text:l.time+'  '+drugName(l.drug)+' · '+(l.place||'📍未命名')}),el('button',{text:'×',title:'删除',onclick:function(){removeLog(l.id);}})]));});
    var sy=symFor(date);
    if(sy&&(sy.items.length||sy.note))day.appendChild(el('div',{class:'dose'},[el('span',{class:'miss',text:'症状：'+sy.items.join('；')+(sy.note?'（'+sy.note+'）':'')})]));
    hist.appendChild(day);
  });
  box.appendChild(hist);
  return box;
}

/* ----- settings ----- */
function pageSet(){
  var box=el('div');
  var c1=el('div',{class:'card'});
  c1.appendChild(el('h2',{text:'吃药时间和疗程'}));
  c1.appendChild(el('p',{class:'note',text:'每种药每天的计划时间（提醒按这里的时间算）。剂量和服用规则按药单设置，医生调整后请告诉我。'}));
  var nameIn={},timeIn={};
  state.drugs.forEach(function(d){
    nameIn[d.id]=el('input',{type:'text',value:d.name,style:'width:110px'});
    timeIn[d.id]=el('input',{type:'time',value:d.time});
    c1.appendChild(el('div',{class:'line'},[nameIn[d.id],timeIn[d.id]]));
  });
  var startIn=el('input',{type:'date',value:state.start}),daysIn=el('input',{type:'text',value:String(state.days),style:'width:70px',inputmode:'numeric'});
  c1.appendChild(el('div',{class:'line'},[el('label',{text:'开始吃药的日期'}),startIn]));
  c1.appendChild(el('div',{class:'line'},[el('label',{text:'疗程天数（26 周 = 182 天）'}),daysIn]));
  c1.appendChild(el('button',{text:'保存设置',onclick:function(){
    state.drugs.forEach(function(d){d.name=nameIn[d.id].value.trim()||d.name;d.time=timeIn[d.id].value||d.time;});
    if(startIn.value)state.start=startIn.value;
    var nn=parseInt(daysIn.value,10);if(nn>0&&nn<=730)state.days=nn;
    _cons={};touch(true);render();doSync();
  }}));
  box.appendChild(c1);

  var c2=el('div',{class:'card'});
  c2.appendChild(el('h2',{text:'常用地点'}));
  c2.appendChild(el('p',{class:'note',text:'把现在所在的位置存为常用地点（在家时存“家”，在 ACE 时存“ACE”）。以后记录时会自动识别。'}));
  var plIn=el('input',{type:'text',placeholder:'地点名称',style:'width:140px'});
  c2.appendChild(el('div',{class:'line'},[plIn,el('button',{class:'ghost small',text:'存当前位置',onclick:async function(){
    var nm=plIn.value.trim();if(!nm)return;
    busy='📍 正在定位…';render();
    try{
      var p=await getPos();
      state.places=state.places.filter(function(x){return x.name!==nm;});
      state.places.push({name:nm,lat:+p.lat.toFixed(5),lng:+p.lng.toFixed(5)});
      busy='✓ 已保存“'+nm+'”';touch(true);doSync();
    }catch(e){busy='⚠️ 没能定位，请检查浏览器的定位权限。';}
    render();
  }})]));
  if(busy)c2.appendChild(el('div',{class:'note',text:busy}));
  if(state.places.length)c2.appendChild(el('div',{class:'note',text:'已存：'+state.places.map(function(p){return p.name;}).join('、')}));
  box.appendChild(c2);

  var c3=el('div',{class:'card'});
  c3.appendChild(el('h2',{text:'同步密钥'}));
  c3.appendChild(el('p',{class:'note',text:'让记录保存到你的私有仓库，并让手机提醒知道你吃没吃。'}));
  var tkIn=el('input',{type:'password',placeholder:token?'已设置（重新粘贴可替换）':'粘贴密钥',style:'flex:1;min-width:0'});
  c3.appendChild(el('div',{class:'line'},[tkIn,el('button',{class:'small',text:'保存密钥',onclick:function(){
    var v=tkIn.value.trim();if(!v)return;token=v;lsSet(LS_TOKEN,v);syncMsg='syncing';syncDetail='';render();doSync();}})]));
  c3.appendChild(el('div',{class:'line'},[el('button',{class:'ghost small',text:'立即同步',onclick:function(){doSync();}})]));
  var stTxt=SYNCMSGS[syncMsg]||'还没有同步过';
  if(syncDetail&&syncMsg==='fail')stTxt+='（'+syncDetail+'。如果是 404，说明密钥没有选到 pill-data 仓库；如果是 403，说明权限不是 Read and write）';
  c3.appendChild(el('div',{class:syncMsg==='ok'?'done':'note',text:'同步状态：'+stTxt}));
  box.appendChild(c3);

  var c4=el('div',{class:'card'});
  c4.appendChild(el('h2',{text:'音效和导出'}));
  var sndCb=el('input',{type:'checkbox',onchange:function(e){lsSet(LS_SOUND,e.target.checked?'on':'off');}});sndCb.checked=soundOn();
  c4.appendChild(el('div',{class:'line'},[el('label',{},[sndCb,' 打开提示音'])]));
  var ta=el('textarea',{readonly:'readonly'});ta.value=csv();
  c4.appendChild(el('div',{class:'line'},[
    el('button',{class:'ghost',text:'下载 CSV',onclick:function(){
      try{var b=new Blob(['﻿'+csv()],{type:'text/csv;charset=utf-8'});var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='服药记录.csv';document.body.appendChild(a);a.click();a.remove();}catch(e){ta.select();}}}),
    el('button',{class:'ghost',text:'复制全部记录',onclick:function(){try{navigator.clipboard.writeText(csv()).catch(function(){ta.select();});}catch(e){ta.select();}}})
  ]));
  c4.appendChild(ta);
  box.appendChild(c4);
  return box;
}

function render(){
  renderTabs();
  app.innerHTML='';
  var page=tab==='sky'?pageSky():tab==='log'?pageLog():tab==='set'?pageSet():pageToday();
  app.appendChild(page);
  runFx();
}

render();
doSync();
document.addEventListener('visibilitychange',function(){
  if(!document.hidden){today=ymd(new Date());doSync();}
});
setInterval(function(){
  var ae=document.activeElement;
  if(tab==='today'&&selDate===today&&!document.hidden&&!(ae&&(ae.tagName==='INPUT'||ae.tagName==='SELECT')))render();
},60000);
})();
</script>
