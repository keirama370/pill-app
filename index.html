<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="服药记录">
<meta name="theme-color" content="#2f7d6b">
<title>服药记录</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1c2430;--mute:#6b7685;--line:#e3e7ec;--accent:#2f7d6b;--warn:#c2410c;--warn-soft:#fff1e6;--ok:#2f7d6b}
@media(prefers-color-scheme:dark){:root{--bg:#12161b;--card:#1b2128;--ink:#e8ecf1;--mute:#93a0b0;--line:#2b333c;--accent:#4fb59e;--warn:#fb923c;--warn-soft:#3a2616;--ok:#4fb59e}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC",sans-serif;padding:calc(14px + env(safe-area-inset-top)) 14px calc(60px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
h1{font-size:20px;margin:6px 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{font-size:15px;margin:0 0 10px;color:var(--mute);font-weight:600}
.stats{display:flex;gap:8px;margin-top:10px}
.stat{flex:1;background:var(--bg);border-radius:10px;padding:8px;text-align:center}
.stat b{display:block;font-size:20px}
.stat span{font-size:12px;color:var(--mute)}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.alert{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-weight:600}
.sync{font-size:12px;color:var(--mute);margin:-4px 0 10px;text-align:right}
.row{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .name{flex:1;min-width:0}
.row .name small{display:block;color:var(--mute);font-size:12px}
.done{color:var(--ok);font-weight:600}
input,button{font:inherit;color:inherit}
input[type=time],input[type=date],input[type=text],input[type=password]{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 8px}
button{border:0;border-radius:10px;padding:9px 14px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer}
button:disabled{opacity:.5}
button.ghost{background:var(--bg);color:var(--ink);border:1px solid var(--line);font-weight:500}
button.small{padding:6px 10px;font-size:14px}
button.big{width:100%;padding:13px;font-size:17px;margin-top:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.chip{padding:7px 12px;border-radius:20px;border:1px solid var(--line);background:var(--bg);cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.line{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.line label{color:var(--mute);font-size:14px}
.day{border-top:1px solid var(--line);padding:10px 0}
.day:first-of-type{border-top:0}
.day h3{margin:0 0 4px;font-size:15px;display:flex;justify-content:space-between}
.day h3 em{font-style:normal;font-size:13px;color:var(--mute)}
.dose{display:flex;justify-content:space-between;font-size:14px;color:var(--mute);padding:2px 0}
.dose button{padding:0 6px;background:none;color:var(--mute);font-size:16px}
.miss{color:var(--warn)}
details summary{cursor:pointer;font-weight:600;color:var(--mute)}
textarea{width:100%;height:120px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px;font-size:12px}
.note{font-size:13px;color:var(--mute)}
ol{padding-left:20px;margin:6px 0}
</style>
</head>
<body>
<h1>💊 服药记录</h1>
<div id="app"></div>
<script>
(function(){
var REPO='keirama370/pill-data', FILE='data.json', BRANCH='main';
var LS_STATE='pill.state', LS_TOKEN='pill.token', LS_SHA='pill.sha', LS_MANUAL='pill.manual';

function pad(n){return String(n).padStart(2,'0');}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function nowHM(){var d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes());}
function parseD(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function dayDiff(a,b){return Math.round((parseD(b)-parseD(a))/86400000);}
function addDays(s,n){var d=parseD(s);d.setDate(d.getDate()+n);return ymd(d);}
function uid(){return 'l'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function clone(o){return JSON.parse(JSON.stringify(o));}
function ls(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}

var today=ymd(new Date());
var selDate=today;
var busy='';
var syncMsg='';
var syncing=false, syncAgain=false;
var token=ls(LS_TOKEN)||'';
var sha=ls(LS_SHA)||null;
var manualPlace=ls(LS_MANUAL)||'家';

function defaults(){return {v:1,settingsAt:0,updatedAt:0,start:today,days:180,
  drugs:[{id:'d1',name:'药 1',time:'08:00'},{id:'d2',name:'药 2',time:'08:00'},{id:'d3',name:'药 3',time:'08:00'},{id:'d4',name:'药 4',time:'08:00'}],
  places:[],logs:[],deleted:[]};}
var state=defaults();
try{var raw=ls(LS_STATE);if(raw)state=Object.assign(defaults(),JSON.parse(raw));}catch(e){}

function touch(settings){var t=Date.now();state.updatedAt=t;if(settings)state.settingsAt=t;lsSet(LS_STATE,JSON.stringify(state));}

/* ---------- sync with GitHub ---------- */
function b64enc(s){return btoa(unescape(encodeURIComponent(s)));}
function b64dec(s){return decodeURIComponent(escape(atob(s.replace(/\n/g,''))));}
function api(method,body){
  return fetch('https://api.github.com/repos/'+REPO+'/contents/'+FILE+(method==='GET'?'?ref='+BRANCH+'&t='+Date.now():''),{
    method:method,cache:'no-store',
    headers:{'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'},
    body:body?JSON.stringify(body):undefined});
}
function merge(a,b){
  if(!b)return a;
  var base=(b.settingsAt||0)>(a.settingsAt||0)?b:a;
  var out=clone(a);
  ['start','days','drugs','settingsAt'].forEach(function(k){out[k]=clone(base[k]);});
  var pm={};(a.places||[]).concat(b.places||[]).forEach(function(p){pm[p.name]=p;});
  out.places=Object.keys(pm).map(function(k){return pm[k];});
  var del={};(a.deleted||[]).concat(b.deleted||[]).forEach(function(i){del[i]=1;});
  out.deleted=Object.keys(del);
  var lm={};(a.logs||[]).concat(b.logs||[]).forEach(function(l){if(!del[l.id]){
    var old=lm[l.id];
    if(!old||(l.place&&!old.place))lm[l.id]=l;}});
  out.logs=Object.keys(lm).map(function(k){return lm[k];});
  out.updatedAt=Math.max(a.updatedAt||0,b.updatedAt||0);
  return out;
}
function same(a,b){return JSON.stringify(a)===JSON.stringify(b);}

async function doSync(){
  if(!token){syncMsg='no-token';return;}
  if(syncing){syncAgain=true;return;}
  syncing=true;syncMsg='syncing';render();
  try{
    for(var attempt=0;attempt<3;attempt++){
      var r=await api('GET'),remote=null,rsha=null;
      if(r.status===401||r.status===403){throw new Error('auth');}
      if(r.status===404){remote=null;rsha=null;}
      else if(!r.ok){throw new Error('http '+r.status);}
      else{var j=await r.json();remote=JSON.parse(b64dec(j.content));rsha=j.sha;}
      var merged=merge(state,remote);
      var needPush=!remote||!same(merged,remote);
      state=merged;lsSet(LS_STATE,JSON.stringify(state));
      if(!needPush){sha=rsha;lsSet(LS_SHA,sha||'');syncMsg='ok';break;}
      var body={message:'update '+new Date().toISOString(),content:b64enc(JSON.stringify(state,null,1)),branch:BRANCH};
      if(rsha)body.sha=rsha;
      var pr=await api('PUT',body);
      if(pr.status===409||pr.status===422){continue;}
      if(pr.status===401||pr.status===403){throw new Error('auth');}
      if(!pr.ok){throw new Error('http '+pr.status);}
      var pj=await pr.json();sha=pj.content&&pj.content.sha;lsSet(LS_SHA,sha||'');syncMsg='ok';break;
    }
    if(syncMsg==='syncing')syncMsg='fail';
  }catch(e){syncMsg=(e&&e.message==='auth')?'auth':'fail';}
  syncing=false;
  if(syncAgain){syncAgain=false;render();return doSync();}
  render();
}

/* ---------- location ---------- */
function getPos(){
  return new Promise(function(res,rej){
    if(!navigator.geolocation){rej(new Error('nogeo'));return;}
    navigator.geolocation.getCurrentPosition(function(p){res({lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy});},
      function(e){rej(e);},{enableHighAccuracy:true,timeout:10000,maximumAge:60000});
  });
}
function distM(a,b){
  var R=6371000,t=Math.PI/180;
  var dLat=(b.lat-a.lat)*t,dLng=(b.lng-a.lng)*t;
  var x=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(a.lat*t)*Math.cos(b.lat*t)*Math.sin(dLng/2)*Math.sin(dLng/2);
  return 2*R*Math.asin(Math.sqrt(x));
}
function matchPlace(pos){
  var best=null,bd=1e9;
  (state.places||[]).forEach(function(p){var d=distM(pos,p);if(d<bd){bd=d;best=p;}});
  return best&&bd<=200?best:null;
}

/* ---------- data helpers ---------- */
function logsFor(date,drugId){return state.logs.filter(function(l){return l.date===date&&(!drugId||l.drug===drugId);});}
function isFull(date){return state.drugs.every(function(d){return logsFor(date,d.id).length>0;});}
function drugName(id){var d=state.drugs.filter(function(x){return x.id===id;})[0];return d?d.name:'(已删除)';}
function removeLog(id){state.logs=state.logs.filter(function(l){return l.id!==id;});state.deleted.push(id);touch(false);render();doSync();}

async function record(items,date){
  // items: [{drug,time}]
  busy='📍 正在定位…';render();
  var pos=null;
  try{pos=await getPos();}catch(e){}
  var m=pos?matchPlace(pos):null;
  items.forEach(function(it){
    if(logsFor(date,it.drug).length)return;
    var l={id:uid(),date:date,drug:it.drug,time:it.time};
    if(pos){l.lat=+pos.lat.toFixed(5);l.lng=+pos.lng.toFixed(5);l.place=m?m.name:'';}
    else{l.place=manualPlace;}
    state.logs.push(l);
  });
  busy=pos?'':'⚠️ 没能定位，已用“'+manualPlace+'”记录。请检查浏览器的定位权限。';
  touch(false);render();doSync();
}

function unnamedGroup(){
  var u=state.logs.filter(function(l){return l.lat!=null&&!l.place;});
  return u.length?u:null;
}

function stats(){
  var elapsed=Math.max(0,Math.min(state.days,dayDiff(state.start,today)+1));
  var fullDays=0,streak=0,missed=0,i;
  for(i=0;i<elapsed;i++){if(isFull(addDays(state.start,i)))fullDays++;}
  var cur=today;
  if(!isFull(cur))cur=addDays(cur,-1);
  while(dayDiff(state.start,cur)>=0&&isFull(cur)){streak++;cur=addDays(cur,-1);}
  for(i=0;i<elapsed-1;i++){if(!isFull(addDays(state.start,i)))missed++;}
  return {fullDays:fullDays,streak:streak,missed:missed};
}
function csv(){
  var rows=['日期,药名,服药时间,地点,纬度,经度'];
  state.logs.slice().sort(function(a,b){return (a.date+a.time)<(b.date+b.time)?-1:1;}).forEach(function(l){
    rows.push([l.date,drugName(l.drug),l.time,l.place||'未命名',l.lat==null?'':l.lat,l.lng==null?'':l.lng].map(function(x){return '"'+String(x).replace(/"/g,'""')+'"';}).join(','));
  });
  return rows.join('\n');
}

/* ---------- ui ---------- */
var app=document.getElementById('app');
function el(tag,attrs,kids){
  var e=document.createElement(tag);
  if(attrs){for(var k in attrs){
    if(attrs[k]==null)continue;
    if(k==='class')e.className=attrs[k];
    else if(k==='text')e.textContent=attrs[k];
    else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),attrs[k]);
    else if(k==='value')e.value=attrs[k];
    else e.setAttribute(k,attrs[k]);
  }}
  (kids||[]).forEach(function(c){if(c==null)return;e.appendChild(typeof c==='string'?document.createTextNode(c):c);});
  return e;
}

function render(){
  var keepOpen=app.querySelector('details')&&app.querySelector('details').open;
  app.innerHTML='';

  // sync status
  var msgs={'ok':'✓ 已同步','syncing':'同步中…','fail':'⏳ 暂时没同步上，稍后会自动重试','auth':'⚠️ 同步密钥无效或已过期，请到“设置”里重新填写','no-token':'⚠️ 还没设置同步密钥，记录只存在这台手机上，提醒功能也不会知道你吃没吃。请到最下面的“设置”里填写。'};
  var cls=(syncMsg==='auth'||syncMsg==='no-token')?'alert':'sync';
  app.appendChild(el('div',{class:cls,text:msgs[syncMsg]||''}));
  if(busy)app.appendChild(el('div',{class:busy.indexOf('⚠️')===0?'alert':'sync',text:busy}));

  var s=stats();
  var dayNo=Math.min(state.days,Math.max(1,dayDiff(state.start,today)+1));

  if(selDate===today){
    var due=state.drugs.filter(function(d){return d.time<=nowHM()&&!logsFor(today,d.id).length;});
    if(due.length)app.appendChild(el('div',{class:'alert',text:'⏰ 该吃了：'+due.map(function(d){return d.name;}).join('、')}));
  }

  app.appendChild(el('div',{class:'card'},[
    el('div',{class:'line'},[el('b',{text:'第 '+dayNo+' / '+state.days+' 天'}),el('span',{class:'note',text:'开始于 '+state.start})]),
    el('div',{class:'bar'},[el('i',{style:'width:'+Math.round(dayNo/state.days*100)+'%'})]),
    el('div',{class:'stats'},[
      el('div',{class:'stat'},[el('b',{text:String(s.fullDays)}),el('span',{text:'全部吃齐的天数'})]),
      el('div',{class:'stat'},[el('b',{text:String(s.streak)}),el('span',{text:'连续天数'})]),
      el('div',{class:'stat'},[el('b',{class:s.missed?'miss':'',text:String(s.missed)}),el('span',{text:'漏吃的天数'})])
    ])
  ]));

  // unnamed places
  var un=unnamedGroup();
  if(un){
    var first=un[0];
    var nameIn=el('input',{type:'text',placeholder:'给这个地点起名，如：家',style:'flex:1'});
    app.appendChild(el('div',{class:'card'},[
      el('div',{text:'📍 有 '+un.length+' 条记录的地点还没命名（以最近一条为准）。起名后，200 米内的记录会自动归为这个地点。'}),
      el('div',{class:'line',style:'margin-top:8px'},[nameIn,el('button',{class:'small',text:'命名',onclick:function(){
        var nm=nameIn.value.trim();if(!nm)return;
        var ref={lat:first.lat,lng:first.lng};
        state.places=state.places.filter(function(p){return p.name!==nm;});
        state.places.push({name:nm,lat:ref.lat,lng:ref.lng});
        state.logs.forEach(function(l){if(l.lat!=null&&!l.place&&distM(ref,l)<=200)l.place=nm;});
        touch(true);render();doSync();
      }})])
    ]));
  }

  // today card
  var card=el('div',{class:'card'});
  card.appendChild(el('h2',{text:selDate===today?'今天':'补记'}));
  card.appendChild(el('div',{class:'line'},[el('label',{text:'日期'}),el('input',{type:'date',value:selDate,max:today,onchange:function(e){if(e.target.value){selDate=e.target.value;render();}}})]));
  var timeInputs={};
  state.drugs.forEach(function(d){
    var got=logsFor(selDate,d.id)[0];
    var row=el('div',{class:'row'});
    row.appendChild(el('div',{class:'name'},[d.name,el('small',{text:'计划 '+d.time})]));
    if(got){
      row.appendChild(el('span',{class:'done',text:'✓ '+got.time+' · '+(got.place||'📍未命名')}));
      row.appendChild(el('button',{class:'ghost small',text:'撤销',onclick:function(){removeLog(got.id);}}));
    }else{
      var t=el('input',{type:'time',value:selDate===today?nowHM():d.time});
      timeInputs[d.id]=t;
      row.appendChild(t);
      row.appendChild(el('button',{class:'small',text:'已吃',disabled:busy.indexOf('定位中')>=0?'disabled':null,onclick:function(){record([{drug:d.id,time:t.value||nowHM()}],selDate);}}));
    }
    card.appendChild(row);
  });
  var pending=state.drugs.filter(function(d){return !logsFor(selDate,d.id).length;});
  if(pending.length>0){
    card.appendChild(el('button',{class:'big',text:'已服药（今日不再提醒）',disabled:busy.indexOf('定位中')>=0?'disabled':null,onclick:function(){
      record(pending.map(function(d){return {drug:d.id,time:timeInputs[d.id].value||nowHM()};}),selDate);
    }}));
  }
  card.appendChild(el('div',{class:'note',style:'margin-top:10px',text:'点“已吃”时会自动读取定位。定位失败时用这个地点：'}));
  var chips=el('div',{class:'chips'});
  var names=state.places.map(function(p){return p.name;});
  if(names.indexOf(manualPlace)<0)names.unshift(manualPlace);
  names.forEach(function(p){chips.appendChild(el('span',{class:'chip'+(p===manualPlace?' on':''),text:p,onclick:function(){manualPlace=p;lsSet(LS_MANUAL,p);render();}}));});
  card.appendChild(chips);
  app.appendChild(card);

  // history
  var hist=el('div',{class:'card'});
  hist.appendChild(el('h2',{text:'历史记录'}));
  var list=[],seen={};
  var elapsed=Math.max(1,Math.min(state.days,dayDiff(state.start,today)+1));
  for(var i=0;i<elapsed;i++){var dd=addDays(state.start,i);list.push(dd);seen[dd]=1;}
  state.logs.forEach(function(l){if(!seen[l.date]){seen[l.date]=1;list.push(l.date);}});
  list.sort().reverse();
  if(!state.logs.length)hist.appendChild(el('div',{class:'note',text:'还没有记录。'}));
  list.forEach(function(date){
    var ls_=logsFor(date).sort(function(a,b){return a.time<b.time?-1:1;});
    if(!ls_.length&&date===today)return;
    var full=isFull(date);
    var day=el('div',{class:'day'});
    day.appendChild(el('h3',{},[date+(date===today?'（今天）':''),el('em',{class:full?'done':'miss',text:full?'✓ 吃齐':(ls_.length+'/'+state.drugs.length)})]));
    ls_.forEach(function(l){
      day.appendChild(el('div',{class:'dose'},[
        el('span',{text:l.time+'  '+drugName(l.drug)+' · '+(l.place||'📍未命名')}),
        el('button',{text:'×',title:'删除',onclick:function(){removeLog(l.id);}})
      ]));
    });
    hist.appendChild(day);
  });
  app.appendChild(hist);

  // settings
  var det=el('details');
  if(keepOpen||syncMsg==='no-token'||syncMsg==='auth')det.open=true;
  det.appendChild(el('summary',{text:'设置 / 导出'}));

  det.appendChild(el('p',{class:'note',text:'1) 药名和计划时间（提醒按这里的时间算）'}));
  var nameIn2={},timeIn={};
  state.drugs.forEach(function(d,i){
    nameIn2[d.id]=el('input',{type:'text',value:d.name,style:'width:140px'});
    timeIn[d.id]=el('input',{type:'time',value:d.time});
    det.appendChild(el('div',{class:'line'},[el('label',{text:'药 '+(i+1)}),nameIn2[d.id],timeIn[d.id]]));
  });
  var startIn=el('input',{type:'date',value:state.start});
  var daysIn=el('input',{type:'text',value:String(state.days),style:'width:70px',inputmode:'numeric'});
  det.appendChild(el('div',{class:'line'},[el('label',{text:'开始日期'}),startIn,el('label',{text:'疗程天数'}),daysIn]));
  det.appendChild(el('button',{text:'保存设置',onclick:function(){
    state.drugs.forEach(function(d){d.name=nameIn2[d.id].value.trim()||d.name;d.time=timeIn[d.id].value||d.time;});
    if(startIn.value)state.start=startIn.value;
    var n=parseInt(daysIn.value,10);if(n>0&&n<=730)state.days=n;
    touch(true);render();doSync();
  }}));

  det.appendChild(el('hr',{style:'border:0;border-top:1px solid var(--line);margin:14px 0'}));
  det.appendChild(el('p',{class:'note',text:'2) 把现在所在的位置存为常用地点（在家时存“家”，在 ACE 时存“ACE”）'}));
  var plIn=el('input',{type:'text',placeholder:'地点名称',style:'width:140px'});
  det.appendChild(el('div',{class:'line'},[plIn,el('button',{class:'ghost small',text:'存当前位置',onclick:async function(){
    var nm=plIn.value.trim();if(!nm)return;
    busy='📍 正在定位…';render();
    try{
      var p=await getPos();
      state.places=state.places.filter(function(x){return x.name!==nm;});
      state.places.push({name:nm,lat:+p.lat.toFixed(5),lng:+p.lng.toFixed(5)});
      busy='✓ 已保存“'+nm+'”';touch(true);doSync();
    }catch(e){busy='⚠️ 没能定位，请检查浏览器的定位权限。';}
    render();
  }})]));
  if(state.places.length){
    det.appendChild(el('div',{class:'note',text:'已存：'+state.places.map(function(p){return p.name;}).join('、')}));
  }

  det.appendChild(el('hr',{style:'border:0;border-top:1px solid var(--line);margin:14px 0'}));
  det.appendChild(el('p',{class:'note',text:'3) 同步密钥（让记录保存到你的私有仓库，并让手机提醒知道你吃没吃）'}));
  var tkIn=el('input',{type:'password',placeholder:token?'已设置（重新粘贴可替换）':'粘贴密钥',style:'flex:1;min-width:0'});
  det.appendChild(el('div',{class:'line'},[tkIn,el('button',{class:'small',text:'保存密钥',onclick:function(){
    var v=tkIn.value.trim();if(!v)return;
    token=v;lsSet(LS_TOKEN,v);sha=null;syncMsg='';doSync();
  }})]));
  det.appendChild(el('div',{class:'line'},[el('button',{class:'ghost small',text:'立即同步',onclick:function(){doSync();}})]));

  det.appendChild(el('hr',{style:'border:0;border-top:1px solid var(--line);margin:14px 0'}));
  var ta=el('textarea',{readonly:'readonly'});ta.value=csv();
  det.appendChild(el('div',{class:'line'},[
    el('button',{class:'ghost',text:'下载 CSV',onclick:function(){
      try{
        var b=new Blob(['﻿'+csv()],{type:'text/csv;charset=utf-8'});
        var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='服药记录.csv';document.body.appendChild(a);a.click();a.remove();
      }catch(e){ta.select();}
    }}),
    el('button',{class:'ghost',text:'复制全部记录',onclick:function(){
      try{navigator.clipboard.writeText(csv()).catch(function(){ta.select();});}catch(e){ta.select();}
    }})
  ]));
  det.appendChild(ta);
  app.appendChild(el('div',{class:'card'},[det]));
}

render();
doSync();
document.addEventListener('visibilitychange',function(){
  if(!document.hidden){today=ymd(new Date());doSync();}
});
setInterval(function(){
  if(selDate===today&&!document.hidden&&!(document.activeElement&&document.activeElement.tagName==='INPUT'))render();
},60000);
})();
</script>
</body>
</html>
