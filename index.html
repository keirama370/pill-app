<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="服药记录">
<meta name="theme-color" content="#0a1230">
<meta name="color-scheme" content="dark">
<title>服药记录</title>
<style>
:root{--ink:#f2f5ff;--mute:rgba(226,232,255,.62);--line:rgba(255,255,255,.13);--glass:rgba(255,255,255,.07);--glass2:rgba(255,255,255,.11);--star:#ffe27a;--acc1:#6f86ff;--acc2:#a07bff;--ok:#5ff0b8;--warn:#ffb877;--warnbg:rgba(255,160,80,.14);--infobg:rgba(120,150,255,.16);--info:#bccbff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{color-scheme:dark;background:#0a1230}
body{margin:0;color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Noto Sans SC",sans-serif;padding:calc(10px + env(safe-area-inset-top)) 14px calc(104px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
#bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:#0a1230}
#bg .ov2{position:absolute;inset:0;background:linear-gradient(rgba(5,8,25,.18),rgba(5,8,25,.55))}
#bg .neb{position:absolute;border-radius:50%;filter:blur(60px);opacity:.38;animation:drift 22s ease-in-out infinite alternate}
#bg .bgs{position:absolute;border-radius:50%;background:#fff;animation:tw 3.2s ease-in-out infinite}
.top{display:flex;justify-content:space-between;align-items:flex-end;margin:6px 4px 14px}
.top .g{font-size:26px;font-weight:800;letter-spacing:.5px;background:linear-gradient(90deg,#fff,var(--star));-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.15}
.top .s{font-size:13px;color:var(--mute);margin-top:2px}
.top .d{font-size:12px;color:var(--mute);text-align:right;line-height:1.35}
.top .d b{display:block;font-size:20px;color:var(--ink);font-weight:700}
.card{background:var(--glass);border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:12px;backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);box-shadow:0 10px 30px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.08)}
.card h2{font-size:13px;margin:0 0 12px;color:var(--mute);font-weight:700;letter-spacing:1.2px}
.alert{background:var(--warnbg);color:var(--warn);border:1px solid rgba(255,184,119,.25);border-radius:16px;padding:10px 13px;margin-bottom:10px;font-weight:600;font-size:14px}
.info{background:var(--infobg);color:var(--info);border:1px solid rgba(160,185,255,.25);border-radius:16px;padding:10px 13px;margin-bottom:10px;font-weight:600;font-size:14px}
.sync{font-size:12px;color:var(--mute);margin:-2px 4px 8px;text-align:right}
input,button,select,textarea{font:inherit;color:inherit}
input[type=time],input[type=date],input[type=text],input[type=password],select{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:9px 11px;color:var(--ink);color-scheme:dark;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--star);box-shadow:0 0 0 3px rgba(255,226,122,.18)}
input::placeholder{color:rgba(226,232,255,.4)}
select option{background:#1a2250;color:#fff}
button{border:0;border-radius:14px;padding:11px 18px;background:linear-gradient(135deg,var(--acc1),var(--acc2));color:#fff;font-weight:700;cursor:pointer;box-shadow:0 6px 18px rgba(80,100,255,.35);transition:transform .12s,box-shadow .12s}
button:active{transform:scale(.96)}
button:disabled{opacity:.45;box-shadow:none}
button.ghost{background:rgba(255,255,255,.08);color:var(--ink);border:1px solid rgba(255,255,255,.18);font-weight:600;box-shadow:none}
button.small{padding:8px 13px;font-size:14px;border-radius:11px}
button.big{width:100%;padding:15px;font-size:17px;margin-top:14px;border-radius:18px;letter-spacing:.5px}
.line{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.line label{color:var(--mute);font-size:14px}
.note{font-size:13px;color:var(--mute);line-height:1.5}
.done{color:var(--ok);font-weight:700}
.miss{color:var(--warn)}
textarea{width:100%;height:150px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:10px;font-size:12px}
hr.sep{border:0;border-top:1px solid var(--line);margin:14px 0}

/* hero */
.sky{position:relative;border-radius:30px;overflow:hidden;color:#fff;padding:16px 16px 18px;margin-bottom:12px;border:1px solid rgba(255,255,255,.2);box-shadow:0 18px 50px rgba(0,0,0,.35),0 0 60px -10px var(--star),inset 0 1px 0 rgba(255,255,255,.25)}
.sky:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.07),transparent 30%,rgba(5,8,25,.35));pointer-events:none}
.sky .bgs{position:absolute;border-radius:50%;background:#fff;animation:tw 3.2s ease-in-out infinite}
.sky>*{position:relative;z-index:1}
.sky.flash{animation:flash .9s ease-out}
.sky .hrow{display:flex;justify-content:space-between;align-items:center;min-height:30px}
.chipS{display:inline-block;padding:5px 12px;border-radius:16px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(6px);font-size:12.5px;letter-spacing:.5px}
.moon{font-size:30px;animation:float 5s ease-in-out infinite;filter:drop-shadow(0 0 10px rgba(255,255,255,.6))}
.wm{position:absolute!important;right:10px;top:34px;font-size:92px;font-weight:900;letter-spacing:8px;color:rgba(255,255,255,.07);line-height:1;pointer-events:none;z-index:0!important}
.csvg{margin:0 -6px}
.csvg svg{width:100%;height:auto;max-height:200px;display:block;overflow:visible}
.hcap{display:flex;justify-content:space-between;align-items:baseline;margin-top:0}
.hcap b{font-size:18px;letter-spacing:1px}
.hcap span{font-size:13px;opacity:.85}
.hbot{display:flex;gap:14px;align-items:center;margin-top:12px}
.hbot .ringw{flex:0 0 auto}
.hmsg{font-size:14px;line-height:1.55;opacity:.96}
.hmsg small{display:block;opacity:.7;font-size:12px;margin-top:2px}
.pulse{animation:glow 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.ignite{animation:ign 1.4s ease-out}
.tdy{animation:ringp 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}

/* bg effects */
.shoot{position:absolute;width:120px;height:2px;background:linear-gradient(90deg,rgba(255,255,255,0),#fff);border-radius:2px;opacity:0;animation:shoot 8s linear infinite}
.auroraL{position:absolute;left:-30%;right:-30%;top:0;height:46%;background:linear-gradient(100deg,rgba(80,255,180,0),rgba(80,255,180,.3),rgba(120,140,255,.3),rgba(255,120,220,0));filter:blur(30px);animation:aur 10s ease-in-out infinite alternate}
.fly{position:absolute;width:5px;height:5px;border-radius:50%;background:#ffef9a;box-shadow:0 0 10px 3px rgba(255,239,154,.8);animation:fl 8s ease-in-out infinite}
.flake{position:absolute;top:-10px;border-radius:50%;background:#fff;opacity:.85;animation:snowf 10s linear infinite}

/* stats */
.stats{display:flex;gap:8px;margin-bottom:12px}
.stat{flex:1;background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:11px 6px 9px;text-align:center;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.stat b{display:block;font-size:22px;font-weight:800;background:linear-gradient(180deg,#fff,var(--star));-webkit-background-clip:text;background-clip:text;color:transparent}
.stat b.miss{background:none;color:var(--warn)}
.stat span{font-size:12px;color:var(--mute)}

/* orbs */
.orbs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:2px}
.orbc{background:var(--glass);border:1px solid var(--line);border-radius:22px;padding:14px 8px 11px;text-align:center;position:relative}
.orbc.off{opacity:.45}
.orbc.got{border-style:dashed}
.orb{width:66px;height:66px;border-radius:50%;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;position:relative;animation:float 3.4s ease-in-out infinite;background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.85),rgba(255,255,255,0) 38%),radial-gradient(circle at 50% 62%,var(--oc),var(--od) 85%);box-shadow:0 0 26px -2px var(--oc),inset -8px -10px 16px rgba(0,0,0,.28),inset 4px 4px 10px rgba(255,255,255,.25)}
.orb svg{width:30px;height:30px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))}
.orbc.got .orb{animation:none;opacity:.5;filter:saturate(.3);box-shadow:none}
.orbc.pop .orb{animation:pop .7s ease-out}
.orbc b{display:block;font-size:15px}
.orbc small{display:block;color:var(--mute);font-size:12px;margin-bottom:7px;min-height:17px}
.orbc input[type=time]{width:100%;margin-bottom:7px;text-align:center}
.orbc button{width:100%}
.fo{position:fixed;z-index:80;border-radius:50%;pointer-events:none;box-shadow:0 0 24px 4px var(--oc)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 4px}
.chip{padding:7px 13px;border-radius:20px;border:1px solid var(--line);background:var(--glass);cursor:pointer;font-size:14px}
.chip.on{background:linear-gradient(135deg,var(--acc1),var(--acc2));border-color:transparent;color:#fff}

/* sky tab */
.gauge{display:flex;gap:16px;align-items:center}
.gauge .gt b{font-size:30px;font-weight:800;background:linear-gradient(180deg,#fff,var(--star));-webkit-background-clip:text;background-clip:text;color:transparent}
.gauge .gt small{display:block;color:var(--mute);font-size:13px}
.consgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cc{border-radius:20px;overflow:hidden;position:relative;color:#fff;cursor:pointer;padding:8px 8px 10px;border:1px solid rgba(255,255,255,.16);box-shadow:0 8px 20px rgba(0,0,0,.25)}
.cc:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.08),transparent 40%,rgba(5,8,25,.3));pointer-events:none}
.cc>*{position:relative;z-index:1}
.cc.future{opacity:.4;filter:saturate(.6)}
.cc.perfect{border-color:#ffd86b;box-shadow:0 0 0 1px #ffd86b,0 0 24px rgba(255,216,107,.45)}
.cc.cur{border-color:#fff;animation:curp 2.4s ease-in-out infinite}
.cc svg{width:100%;height:auto;display:block}
.cc .cn{display:flex;justify-content:space-between;font-size:13px;margin-top:2px}
.cc .cn b{font-size:14px}
.themeg{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.ti{min-width:70px;padding:9px 8px 7px;border-radius:16px;border:1px solid var(--line);background:var(--glass);text-align:center;cursor:pointer;font-size:12px}
.ti .pv{display:flex;height:32px;align-items:center;justify-content:center;font-size:22px;margin-bottom:3px}
.ti.on{border-color:var(--star);box-shadow:0 0 0 1px var(--star),0 0 16px -2px var(--star)}
.ti.lock{opacity:.4;cursor:default}
.sw{display:inline-block;width:44px;height:26px;border-radius:9px;border:1px solid rgba(255,255,255,.35)}
.bar{height:8px;background:rgba(255,255,255,.12);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc1),var(--star))}

/* logs */
.day{border-top:1px solid var(--line);padding:11px 0}
.day:first-of-type{border-top:0}
.day h3{margin:0 0 4px;font-size:15px;display:flex;justify-content:space-between}
.day h3 em{font-style:normal;font-size:13px;color:var(--mute)}
.dose{display:flex;justify-content:space-between;font-size:14px;color:var(--mute);padding:2px 0}
.dose button{padding:0 8px;background:none;color:var(--mute);font-size:17px;box-shadow:none}
.appt{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.appt.past{color:var(--mute);text-decoration:line-through}
.appt button{padding:0 8px;background:none;color:var(--mute);font-size:17px;box-shadow:none}
.sym h4{margin:14px 0 4px;font-size:14px;color:var(--star)}
.sym label{display:flex;gap:10px;align-items:flex-start;padding:6px 0;font-size:15px}
.sym input[type=checkbox]{margin-top:4px;width:18px;height:18px;accent-color:var(--acc1)}

/* tab bar */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:center;padding:0 14px calc(12px + env(safe-area-inset-bottom));pointer-events:none}
#tabs .tb{pointer-events:auto;display:flex;width:100%;max-width:420px;background:rgba(18,24,60,.62);border:1px solid rgba(255,255,255,.18);border-radius:30px;box-shadow:0 14px 40px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.12);backdrop-filter:blur(22px) saturate(1.5);-webkit-backdrop-filter:blur(22px) saturate(1.5);padding:6px}
#tabs button{flex:1;background:none;color:var(--mute);border-radius:24px;padding:8px 0 6px;font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px;box-shadow:none;letter-spacing:.5px;transition:all .25s}
#tabs button svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#tabs button.on{color:#fff;background:linear-gradient(135deg,rgba(255,255,255,.2),rgba(255,255,255,.06));box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 0 18px -4px var(--star)}
#tabs button.on svg{stroke:var(--star);filter:drop-shadow(0 0 5px var(--star))}

/* entrance */
.enter>*{animation:up .55s cubic-bezier(.2,.8,.2,1) both}
.enter>*:nth-child(2){animation-delay:.05s}.enter>*:nth-child(3){animation-delay:.1s}.enter>*:nth-child(4){animation-delay:.15s}.enter>*:nth-child(5){animation-delay:.2s}.enter>*:nth-child(6){animation-delay:.25s}.enter>*:nth-child(n+7){animation-delay:.3s}

/* overlays */
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top));transform:translateX(-50%);background:rgba(20,26,60,.85);border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(12px);color:#fff;padding:10px 18px;border-radius:22px;font-weight:700;z-index:90;animation:toast 2s ease forwards;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.cf{position:fixed;z-index:85;pointer-events:none;animation:rise 2s ease-out forwards;font-weight:700}
.ov{position:fixed;inset:0;background:rgba(3,5,20,.7);backdrop-filter:blur(6px);z-index:95;display:flex;align-items:center;justify-content:center;padding:18px}
.modal{position:relative;background:linear-gradient(180deg,rgba(40,50,110,.92),rgba(14,20,55,.96));color:#fff;border:1px solid rgba(255,255,255,.22);border-radius:28px;padding:26px 20px 22px;max-width:360px;width:100%;text-align:center;animation:pop .5s ease-out;max-height:90vh;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.modal .big1{font-size:60px;position:relative;z-index:1}
.modal h3{margin:6px 0 8px;font-size:20px;position:relative;z-index:1}
.modal p{margin:6px 0;font-size:15px;position:relative;z-index:1}
.modal .pv{position:relative;z-index:1}
.rays{position:absolute;left:50%;top:-40px;width:340px;height:340px;margin-left:-170px;background:conic-gradient(from 0deg,rgba(255,226,122,0),rgba(255,226,122,.35),rgba(255,226,122,0) 12%,rgba(255,226,122,.35) 25%,rgba(255,226,122,0) 37%,rgba(255,226,122,.35) 50%,rgba(255,226,122,0) 62%,rgba(255,226,122,.35) 75%,rgba(255,226,122,0) 87%,rgba(255,226,122,.35));border-radius:50%;animation:spin 8s linear infinite;-webkit-mask-image:radial-gradient(circle,#000 20%,transparent 68%);mask-image:radial-gradient(circle,#000 20%,transparent 68%)}
.shake{animation:shake .7s ease-in-out infinite}

@keyframes tw{0%,100%{opacity:.12}50%{opacity:.9}}
@keyframes drift{0%{transform:translate(0,0) scale(1)}100%{transform:translate(40px,30px) scale(1.15)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes glow{0%,100%{opacity:.18;transform:scale(1)}50%{opacity:.55;transform:scale(1.25)}}
@keyframes ign{0%{transform:scale(.2);opacity:0}40%{transform:scale(2.6);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes ringp{0%,100%{opacity:.9;transform:scale(1)}50%{opacity:.3;transform:scale(1.6)}}
@keyframes shoot{0%{opacity:0;transform:translate(0,0) rotate(28deg)}3%{opacity:1}12%{opacity:0;transform:translate(-70vw,38vh) rotate(28deg)}100%{opacity:0}}
@keyframes aur{0%{transform:translateX(-6%) skewX(-4deg);opacity:.6}100%{transform:translateX(6%) skewX(4deg);opacity:1}}
@keyframes fl{0%,100%{transform:translate(0,0);opacity:.2}25%{transform:translate(16px,-22px);opacity:1}50%{transform:translate(-10px,-40px);opacity:.4}75%{transform:translate(14px,-18px);opacity:1}}
@keyframes snowf{to{transform:translate(30px,108vh)}}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.14)}100%{transform:scale(1)}}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-10px)}12%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-6px)}}
@keyframes rise{0%{opacity:1;transform:translate(0,0) scale(.6)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.3) rotate(var(--rot))}}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes flash{0%{filter:brightness(1)}30%{filter:brightness(1.5)}100%{filter:brightness(1)}}
@keyframes curp{0%,100%{box-shadow:0 0 0 1px #fff,0 0 8px rgba(255,255,255,.3)}50%{box-shadow:0 0 0 1px #fff,0 0 22px rgba(255,255,255,.7)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shake{0%,100%{transform:rotate(0)}20%{transform:rotate(-12deg) scale(1.05)}40%{transform:rotate(10deg) scale(1.08)}60%{transform:rotate(-8deg) scale(1.05)}80%{transform:rotate(6deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.cf{display:none}}
</style>
</head>
<body>
<div id="bg"></div>
<div id="app"></div>
<div id="tabs"></div>
<script>
(function(){
var REPO='keirama370/pill-data', FILE='data.json', BRANCH='main';
var LS_STATE='pill.state', LS_TOKEN='pill.token', LS_SHA='pill.sha', LS_MANUAL='pill.manual';
var WDN=['','一','二','三','四','五','六','日'];

function pad(n){return String(n).padStart(2,'0');}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function nowHM(){var d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes());}
function parseD(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function dayDiff(a,b){return Math.round((parseD(b)-parseD(a))/86400000);}
function addDays(s,n){var d=parseD(s);d.setDate(d.getDate()+n);return ymd(d);}
function uid(){return 'l'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function clone(o){return JSON.parse(JSON.stringify(o));}
function ls(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}

var today=ymd(new Date());
var selDate=today;
var busy='';
var syncMsg='',syncDetail='';
var syncing=false,syncAgain=false;
var token=ls(LS_TOKEN)||'';
var manualPlace=ls(LS_MANUAL)||'家';
var symDraft=null;
var summaryText='';

/* ---------- data model ---------- */
function defaultDrugs(){return [
 {id:'d1',name:'贝达喹啉',en:'Bedaquiline',time:'08:00',sched:[{from:1,to:14,dose:'400毫克'},{from:15,dose:'200毫克',wd:[1,3,5]}]},
 {id:'d2',name:'普托马尼',en:'Pretomanid',time:'08:00',sched:[{from:1,dose:'200毫克'}]},
 {id:'d3',name:'利奈唑胺',en:'Linezolid',time:'08:00',sched:[{from:1,dose:'600毫克'}]},
 {id:'d4',name:'莫西沙星',en:'Moxifloxacin',time:'08:00',sched:[{from:1,dose:'400毫克'}]}];}
function defaults(){return {v:2,settingsAt:0,updatedAt:0,start:today,days:182,drugs:defaultDrugs(),sky:{palette:'ocean',star:'dot',line:'plain',moon:'none',title:'启程者',fx:[]},places:[],logs:[],symptoms:[],appts:[],deleted:[]};}
function migrate(s){
  if(!s)return s;
  if((s.v||1)<2){
    var d0=defaultDrugs();
    (s.drugs||[]).forEach(function(d,i){if(d0[i]&&d.time)d0[i].time=d.time;});
    s.drugs=d0;if(s.days===180)s.days=182;s.v=2;s.settingsAt=Date.now();
  }
  ['places','logs','symptoms','appts','deleted'].forEach(function(k){if(!s[k])s[k]=[];});
  if(!s.sky)s.sky={palette:'ocean',star:'dot',line:'plain',moon:'none',title:'启程者',fx:[]};
  delete s.pet;
  return s;
}
var state=defaults();

/* ---------- schedule rules ---------- */
function dayNo(date){return dayDiff(state.start,date)+1;}
function wdOf(date){return (parseD(date).getDay()+6)%7+1;}
function phaseFor(d,n){var ph=null;(d.sched||[]).forEach(function(p){if(n>=p.from&&(p.to==null||n<=p.to))ph=p;});return ph;}
function dueInfo(d,date){
  var n=dayNo(date);if(n<1||n>state.days)return null;
  var ph=phaseFor(d,n);if(!ph)return null;
  if(ph.wd&&ph.wd.indexOf(wdOf(date))<0)return null;
  return {dose:ph.dose};
}
function dueDrugs(date){return state.drugs.filter(function(d){return dueInfo(d,date);});}
function logsFor(date,drugId){return state.logs.filter(function(l){return l.date===date&&(!drugId||l.drug===drugId);});}
function isFull(date){var dd=dueDrugs(date);return dd.length>0&&dd.every(function(d){return logsFor(date,d.id).length>0;});}
function drugName(id){var d=state.drugs.filter(function(x){return x.id===id;})[0];return d?d.name:'(已删除)';}
function ruleText(d,date){
  var ph=phaseFor(d,dayNo(date));if(!ph)return '';
  return ph.wd?('每周'+ph.wd.map(function(x){return WDN[x];}).join('、')+'，每次'+ph.dose):('每天，每次'+ph.dose);
}
function endDate(){return addDays(state.start,state.days-1);}

/* ---------- sync with GitHub ---------- */
function b64enc(s){return btoa(unescape(encodeURIComponent(s)));}
function b64dec(s){return decodeURIComponent(escape(atob(s.replace(/\n/g,''))));}
function api(method,body){
  return fetch('https://api.github.com/repos/'+REPO+'/contents/'+FILE+(method==='GET'?'?ref='+BRANCH+'&t='+Date.now():''),{
    method:method,cache:'no-store',
    headers:{'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'},
    body:body?JSON.stringify(body):undefined});
}
function cmp(a,b){return a<b?-1:a>b?1:0;}
function norm(s){
  return {v:2,settingsAt:s.settingsAt||0,updatedAt:s.updatedAt||0,start:s.start,days:s.days,drugs:s.drugs,sky:s.sky||{palette:'ocean',star:'dot',line:'plain',moon:'none',title:'启程者',fx:[]},
    places:(s.places||[]).slice().sort(function(a,b){return cmp(a.name,b.name);}),
    logs:(s.logs||[]).slice().sort(function(a,b){return cmp(a.date+a.time+a.id,b.date+b.time+b.id);}),
    symptoms:(s.symptoms||[]).slice().sort(function(a,b){return cmp(a.date,b.date);}),
    appts:(s.appts||[]).slice().sort(function(a,b){return cmp(a.date+a.id,b.date+b.id);}),
    deleted:(s.deleted||[]).slice().sort()};
}
function merge(a,b){
  if(!b)return norm(a);
  var base=(b.settingsAt||0)>(a.settingsAt||0)?b:a;
  var del={};(a.deleted||[]).concat(b.deleted||[]).forEach(function(i){del[i]=1;});
  var pm={};(a.places||[]).concat(b.places||[]).forEach(function(p){pm[p.name]=p;});
  var lm={};(a.logs||[]).concat(b.logs||[]).forEach(function(l){if(del[l.id])return;var o=lm[l.id];if(!o||(l.place&&!o.place))lm[l.id]=l;});
  var sm={};(a.symptoms||[]).concat(b.symptoms||[]).forEach(function(x){var o=sm[x.id];if(!o||(x.updatedAt||0)>(o.updatedAt||0))sm[x.id]=x;});
  var am={};(a.appts||[]).concat(b.appts||[]).forEach(function(x){if(!del[x.id])am[x.id]=x;});
  var vals=function(m){return Object.keys(m).map(function(k){return m[k];});};
  return norm({settingsAt:base.settingsAt,updatedAt:Math.max(a.updatedAt||0,b.updatedAt||0),start:base.start,days:base.days,drugs:clone(base.drugs),sky:clone(base.sky||{palette:'ocean',star:'dot',line:'plain',moon:'none',title:'启程者',fx:[]}),
    places:vals(pm),logs:vals(lm),symptoms:vals(sm),appts:vals(am),deleted:Object.keys(del)});
}
function same(a,b){return JSON.stringify(norm(a))===JSON.stringify(norm(b));}
async function failText(r){var t='';try{var j=await r.json();t=j.message||'';}catch(e){}return 'http '+r.status+(t?' '+t:'');}

async function doSync(){
  if(!token){syncMsg='no-token';render();return;}
  if(syncing){syncAgain=true;return;}
  syncing=true;syncMsg='syncing';syncDetail='';render();
  try{
    for(var attempt=0;attempt<3;attempt++){
      var r=await api('GET'),remote=null,rsha=null;
      if(r.status===401||r.status===403){throw new Error('auth');}
      if(r.status===404){remote=null;rsha=null;}
      else if(!r.ok){throw new Error(await failText(r));}
      else{var j=await r.json();remote=migrate(JSON.parse(b64dec(j.content)));rsha=j.sha;}
      var merged=merge(state,remote);
      var needPush=!remote||!same(merged,remote);
      state=merged;lsSet(LS_STATE,JSON.stringify(state));
      if(!needPush){syncMsg='ok';break;}
      var body={message:'update '+new Date().toISOString(),content:b64enc(JSON.stringify(state,null,1)),branch:BRANCH};
      if(rsha)body.sha=rsha;
      var pr=await api('PUT',body);
      if(pr.status===409||pr.status===422){continue;}
      if(pr.status===401||pr.status===403){throw new Error('auth');}
      if(!pr.ok){throw new Error(await failText(pr));}
      syncMsg='ok';break;
    }
    if(syncMsg==='syncing')syncMsg='fail';
  }catch(e){syncMsg=(e&&e.message==='auth')?'auth':'fail';syncDetail=(e&&e.message)||'';}
  syncing=false;
  if(syncAgain){syncAgain=false;return doSync();}
  render();
}

/* ---------- location ---------- */
function getPos(){
  return new Promise(function(res,rej){
    if(!navigator.geolocation){rej(new Error('nogeo'));return;}
    navigator.geolocation.getCurrentPosition(function(p){res({lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy});},
      function(e){rej(e);},{enableHighAccuracy:true,timeout:10000,maximumAge:60000});
  });
}
function distM(a,b){
  var R=6371000,t=Math.PI/180;
  var dLat=(b.lat-a.lat)*t,dLng=(b.lng-a.lng)*t;
  var x=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(a.lat*t)*Math.cos(b.lat*t)*Math.sin(dLng/2)*Math.sin(dLng/2);
  return 2*R*Math.asin(Math.sqrt(x));
}
function matchPlace(pos){
  var best=null,bd=1e9;
  (state.places||[]).forEach(function(p){var d=distM(pos,p);if(d<bd){bd=d;best=p;}});
  return best&&bd<=200?best:null;
}

function removeLog(id){state.logs=state.logs.filter(function(l){return l.id!==id;});state.deleted.push(id);touch(false);render();doSync();}
async function record(items,date){
  busy='📍 正在定位…';render();
  var pos=null;
  try{pos=await getPos();}catch(e){}
  var m=pos?matchPlace(pos):null;
  var wasFull=isFull(date),pf=fullCount();
  items.forEach(function(it){
    if(logsFor(date,it.drug).length)return;
    var l={id:uid(),date:date,drug:it.drug,time:it.time};
    if(pos){l.lat=+pos.lat.toFixed(5);l.lng=+pos.lng.toFixed(5);l.place=m?m.name:'';}
    else{l.place=manualPlace;}
    state.logs.push(l);
  });
  var nowFull=isFull(date);
  fxJust=items.map(function(it){return it.drug;});
  fx={n:items.length,full:nowFull&&!wasFull,modal:buildModal(pf,fullCount())};
  if(fx.full)fxIgnite=date;
  busy=pos?'':'⚠️ 没能定位，已用“'+manualPlace+'”记录。请检查浏览器的定位权限。';
  touch(false);render();doSync();
}

/* ---------- stats & summary ---------- */
function stats(){
  var elapsed=Math.max(0,Math.min(state.days,dayNo(today))),fullDays=0,streak=0,missed=0,i;
  for(i=0;i<elapsed;i++){if(isFull(addDays(state.start,i)))fullDays++;}
  var cur=today;
  if(!isFull(cur))cur=addDays(cur,-1);
  while(dayNo(cur)>=1&&isFull(cur)){streak++;cur=addDays(cur,-1);}
  for(i=0;i<elapsed-1;i++){if(!isFull(addDays(state.start,i)))missed++;}
  return {fullDays:fullDays,streak:streak,missed:missed};
}
function buildSummary(){
  var n=Math.max(0,Math.min(state.days,dayNo(today)));
  var past=Math.max(0,Math.min(state.days,dayNo(today)-1)); // finished days (before today)
  var lines=[];
  lines.push('服药情况汇总（生成于 '+today+'）');
  lines.push('疗程：'+state.start+' 起，共 '+Math.round(state.days/7)+' 周，预计 '+endDate()+' 结束；今天是第 '+n+' 天（第 '+Math.min(Math.round(state.days/7),Math.floor((Math.max(n,1)-1)/7)+1)+' 周）');
  var due={},took={},missList=[],weekFull={},weekDue={},fullPast=0,i;
  state.drugs.forEach(function(d){due[d.id]=0;took[d.id]=0;});
  for(i=0;i<past;i++){
    var dt=addDays(state.start,i),dd=dueDrugs(dt),w=Math.floor(i/7)+1;
    weekDue[w]=(weekDue[w]||0)+1;
    var all=true;
    dd.forEach(function(d){due[d.id]++;if(logsFor(dt,d.id).length)took[d.id]++;else{all=false;missList.push(dt+' '+d.name);}});
    if(all){fullPast++;weekFull[w]=(weekFull[w]||0)+1;}
  }
  lines.push('');
  lines.push('已过完的 '+past+' 天里：按计划全部吃齐 '+fullPast+' 天，有漏吃的 '+(past-fullPast)+' 天。');
  lines.push('');lines.push('按药统计（已过完的天数内，已吃/应吃）：');
  state.drugs.forEach(function(d){lines.push('- '+d.name+'：'+took[d.id]+'/'+due[d.id]);});
  lines.push('');lines.push('漏吃记录：'+(missList.length?'':'无'));
  var byDate={};missList.forEach(function(x){var p=x.split(' ');(byDate[p[0]]=byDate[p[0]]||[]).push(p[1]);});
  Object.keys(byDate).sort().forEach(function(dt){lines.push('- '+dt+'：'+byDate[dt].join('、'));});
  lines.push('');lines.push('每周吃齐的天数：');
  Object.keys(weekDue).forEach(function(w){lines.push('- 第 '+w+' 周：'+(weekFull[w]||0)+'/'+weekDue[w]+' 天');});
  lines.push('');
  var syms=state.symptoms.filter(function(x){return x.items.length||x.note;}).slice().sort(function(a,b){return cmp(a.date,b.date);});
  lines.push('症状记录：'+(syms.length?'':'无'));
  syms.forEach(function(x){lines.push('- '+x.date+'：'+(x.items.join('；')||'')+(x.note?'（备注：'+x.note+'）':''));});
  lines.push('');
  var ap=state.appts.slice().sort(function(a,b){return cmp(a.date,b.date);});
  lines.push('复诊/检查安排：'+(ap.length?'':'无'));
  ap.forEach(function(x){lines.push('- '+x.date+' '+x.title);});
  lines.push('');lines.push('（以上为本人在手机上的自我记录，仅供复诊时参考。）');
  return lines.join('\n');
}
function csv(){
  var rows=['日期,药名,服药时间,地点,纬度,经度'];
  state.logs.slice().sort(function(a,b){return cmp(a.date+a.time,b.date+b.time);}).forEach(function(l){
    rows.push([l.date,drugName(l.drug),l.time,l.place||'未命名',l.lat==null?'':l.lat,l.lng==null?'':l.lng].map(function(x){return '"'+String(x).replace(/"/g,'""')+'"';}).join(','));
  });
  return rows.join('\n');
}

    el('button',{class:'ghost',text:'复制全部记录',onclick:function(){try{navigator.clipboard.writeText(csv()).catch(function(){ta.select();});}catch(e){ta.select();}}})
  ]));
  c4.appendChild(ta);
  box.appendChild(c4);
  return box;
}

function render(){
  setBg();renderTabs();
  app.innerHTML='';
  var page=tab==='sky'?pageSky():tab==='log'?pageLog():tab==='set'?pageSet():pageToday();
  while(page.firstChild)app.appendChild(page.firstChild);
  app.className=enter?'enter':'';enter=false;
  runFx();
}
render();
doSync();
document.addEventListener('visibilitychange',function(){
  if(!document.hidden){today=ymd(new Date());doSync();}
});
setInterval(function(){
  var ae=document.activeElement;
  if(tab==='today'&&selDate===today&&!document.hidden&&!(ae&&(ae.tagName==='INPUT'||ae.tagName==='SELECT')))render();
},60000);
})();
</script>
