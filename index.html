<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="服药记录">
<meta name="theme-color" content="#2f7d6b">
<title>服药记录</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1c2430;--mute:#6b7685;--line:#e3e7ec;--accent:#2f7d6b;--warn:#c2410c;--warn-soft:#fff1e6;--ok:#2f7d6b;--info-soft:#e6f0fb;--info:#1d5fa8}
@media(prefers-color-scheme:dark){:root{--bg:#12161b;--card:#1b2128;--ink:#e8ecf1;--mute:#93a0b0;--line:#2b333c;--accent:#4fb59e;--warn:#fb923c;--warn-soft:#3a2616;--ok:#4fb59e;--info-soft:#17283d;--info:#7fb4f0}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC",sans-serif;padding:calc(14px + env(safe-area-inset-top)) 14px calc(60px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
h1{font-size:20px;margin:6px 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{font-size:15px;margin:0 0 10px;color:var(--mute);font-weight:600}
.stats{display:flex;gap:8px;margin-top:10px}
.stat{flex:1;background:var(--bg);border-radius:10px;padding:8px;text-align:center}
.stat b{display:block;font-size:20px}
.stat span{font-size:12px;color:var(--mute)}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.alert{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-weight:600}
.info{background:var(--info-soft);color:var(--info);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-weight:600}
.sync{font-size:12px;color:var(--mute);margin:-4px 0 10px;text-align:right}
.row{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .name{flex:1;min-width:0}
.row .name small{display:block;color:var(--mute);font-size:12px}
.row.off{opacity:.55}
.done{color:var(--ok);font-weight:600}
input,button,select,textarea{font:inherit;color:inherit}
input[type=time],input[type=date],input[type=text],input[type=password],select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 8px}
button{border:0;border-radius:10px;padding:9px 14px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer}
button:disabled{opacity:.5}
button.ghost{background:var(--bg);color:var(--ink);border:1px solid var(--line);font-weight:500}
button.small{padding:6px 10px;font-size:14px}
button.big{width:100%;padding:13px;font-size:17px;margin-top:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.chip{padding:7px 12px;border-radius:20px;border:1px solid var(--line);background:var(--bg);cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.line{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.line label{color:var(--mute);font-size:14px}
.day{border-top:1px solid var(--line);padding:10px 0}
.day:first-of-type{border-top:0}
.day h3{margin:0 0 4px;font-size:15px;display:flex;justify-content:space-between}
.day h3 em{font-style:normal;font-size:13px;color:var(--mute)}
.dose{display:flex;justify-content:space-between;font-size:14px;color:var(--mute);padding:2px 0}
.dose button{padding:0 6px;background:none;color:var(--mute);font-size:16px}
.miss{color:var(--warn)}
details summary{cursor:pointer;font-weight:600;color:var(--mute)}
textarea{width:100%;height:150px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;font-size:12px}
.note{font-size:13px;color:var(--mute)}
.sym h4{margin:12px 0 4px;font-size:14px}
.sym label{display:flex;gap:8px;align-items:flex-start;padding:5px 0;font-size:15px}
.sym input[type=checkbox]{margin-top:4px;width:18px;height:18px}
.appt{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-size:15px}
.appt.past{color:var(--mute);text-decoration:line-through}
.appt button{padding:0 6px;background:none;color:var(--mute);font-size:16px}
</style>
</head>
<body>
<h1>💊 服药记录</h1>
<div id="app"></div>
<script>
(function(){
var REPO='keirama370/pill-data', FILE='data.json', BRANCH='main';
var LS_STATE='pill.state', LS_TOKEN='pill.token', LS_SHA='pill.sha', LS_MANUAL='pill.manual';
var WDN=['','一','二','三','四','五','六','日'];

function pad(n){return String(n).padStart(2,'0');}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function nowHM(){var d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes());}
function parseD(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function dayDiff(a,b){return Math.round((parseD(b)-parseD(a))/86400000);}
function addDays(s,n){var d=parseD(s);d.setDate(d.getDate()+n);return ymd(d);}
function uid(){return 'l'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function clone(o){return JSON.parse(JSON.stringify(o));}
function ls(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}

var today=ymd(new Date());
var selDate=today;
var busy='';
var syncMsg='',syncDetail='';
var syncing=false,syncAgain=false;
var token=ls(LS_TOKEN)||'';
var manualPlace=ls(LS_MANUAL)||'家';
var symDraft=null;
var summaryText='';

/* ---------- data model ---------- */
function defaultDrugs(){return [
 {id:'d1',name:'贝达喹啉',en:'Bedaquiline',time:'08:00',sched:[{from:1,to:14,dose:'400毫克'},{from:15,dose:'200毫克',wd:[1,3,5]}]},
 {id:'d2',name:'普托马尼',en:'Pretomanid',time:'08:00',sched:[{from:1,dose:'200毫克'}]},
 {id:'d3',name:'利奈唑胺',en:'Linezolid',time:'08:00',sched:[{from:1,dose:'600毫克'}]},
 {id:'d4',name:'莫西沙星',en:'Moxifloxacin',time:'08:00',sched:[{from:1,dose:'400毫克'}]}];}
function defaults(){return {v:2,settingsAt:0,updatedAt:0,start:today,days:182,drugs:defaultDrugs(),places:[],logs:[],symptoms:[],appts:[],deleted:[]};}
function migrate(s){
  if(!s)return s;
  if((s.v||1)<2){
    var d0=defaultDrugs();
    (s.drugs||[]).forEach(function(d,i){if(d0[i]&&d.time)d0[i].time=d.time;});
    s.drugs=d0;if(s.days===180)s.days=182;s.v=2;s.settingsAt=Date.now();
  }
  ['places','logs','symptoms','appts','deleted'].forEach(function(k){if(!s[k])s[k]=[];});
  return s;
}
var state=defaults();
try{var raw=ls(LS_STATE);if(raw)state=migrate(Object.assign(defaults(),JSON.parse(raw)));}catch(e){}
lsSet(LS_STATE,JSON.stringify(state));

function touch(settings){var t=Date.now();state.updatedAt=t;if(settings)state.settingsAt=t;lsSet(LS_STATE,JSON.stringify(state));}

/* ---------- schedule rules ---------- */
function dayNo(date){return dayDiff(state.start,date)+1;}
function wdOf(date){return (parseD(date).getDay()+6)%7+1;}
function phaseFor(d,n){var ph=null;(d.sched||[]).forEach(function(p){if(n>=p.from&&(p.to==null||n<=p.to))ph=p;});return ph;}
function dueInfo(d,date){
  var n=dayNo(date);if(n<1||n>state.days)return null;
  var ph=phaseFor(d,n);if(!ph)return null;
  if(ph.wd&&ph.wd.indexOf(wdOf(date))<0)return null;
  return {dose:ph.dose};
}
function dueDrugs(date){return state.drugs.filter(function(d){return dueInfo(d,date);});}
function logsFor(date,drugId){return state.logs.filter(function(l){return l.date===date&&(!drugId||l.drug===drugId);});}
function isFull(date){var dd=dueDrugs(date);return dd.length>0&&dd.every(function(d){return logsFor(date,d.id).length>0;});}
function drugName(id){var d=state.drugs.filter(function(x){return x.id===id;})[0];return d?d.name:'(已删除)';}
function ruleText(d,date){
  var ph=phaseFor(d,dayNo(date));if(!ph)return '';
  return ph.wd?('每周'+ph.wd.map(function(x){return WDN[x];}).join('、')+'，每次'+ph.dose):('每天，每次'+ph.dose);
}
function endDate(){return addDays(state.start,state.days-1);}

/* ---------- sync with GitHub ---------- */
function b64enc(s){return btoa(unescape(encodeURIComponent(s)));}
function b64dec(s){return decodeURIComponent(escape(atob(s.replace(/\n/g,''))));}
function api(method,body){
  return fetch('https://api.github.com/repos/'+REPO+'/contents/'+FILE+(method==='GET'?'?ref='+BRANCH+'&t='+Date.now():''),{
    method:method,cache:'no-store',
    headers:{'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'},
    body:body?JSON.stringify(body):undefined});
}
function cmp(a,b){return a<b?-1:a>b?1:0;}
function norm(s){
  return {v:2,settingsAt:s.settingsAt||0,updatedAt:s.updatedAt||0,start:s.start,days:s.days,drugs:s.drugs,
    places:(s.places||[]).slice().sort(function(a,b){return cmp(a.name,b.name);}),
    logs:(s.logs||[]).slice().sort(function(a,b){return cmp(a.date+a.time+a.id,b.date+b.time+b.id);}),
    symptoms:(s.symptoms||[]).slice().sort(function(a,b){return cmp(a.date,b.date);}),
    appts:(s.appts||[]).slice().sort(function(a,b){return cmp(a.date+a.id,b.date+b.id);}),
    deleted:(s.deleted||[]).slice().sort()};
}
function merge(a,b){
  if(!b)return norm(a);
  var base=(b.settingsAt||0)>(a.settingsAt||0)?b:a;
  var del={};(a.deleted||[]).concat(b.deleted||[]).forEach(function(i){del[i]=1;});
  var pm={};(a.places||[]).concat(b.places||[]).forEach(function(p){pm[p.name]=p;});
  var lm={};(a.logs||[]).concat(b.logs||[]).forEach(function(l){if(del[l.id])return;var o=lm[l.id];if(!o||(l.place&&!o.place))lm[l.id]=l;});
  var sm={};(a.symptoms||[]).concat(b.symptoms||[]).forEach(function(x){var o=sm[x.id];if(!o||(x.updatedAt||0)>(o.updatedAt||0))sm[x.id]=x;});
  var am={};(a.appts||[]).concat(b.appts||[]).forEach(function(x){if(!del[x.id])am[x.id]=x;});
  var vals=function(m){return Object.keys(m).map(function(k){return m[k];});};
  return norm({settingsAt:base.settingsAt,updatedAt:Math.max(a.updatedAt||0,b.updatedAt||0),start:base.start,days:base.days,drugs:clone(base.drugs),
    places:vals(pm),logs:vals(lm),symptoms:vals(sm),appts:vals(am),deleted:Object.keys(del)});
}
function same(a,b){return JSON.stringify(norm(a))===JSON.stringify(norm(b));}
async function failText(r){var t='';try{var j=await r.json();t=j.message||'';}catch(e){}return 'http '+r.status+(t?' '+t:'');}

async function doSync(){
  if(!token){syncMsg='no-token';render();return;}
  if(syncing){syncAgain=true;return;}
  syncing=true;syncMsg='syncing';syncDetail='';render();
  try{
    for(var attempt=0;attempt<3;attempt++){
      var r=await api('GET'),remote=null,rsha=null;
      if(r.status===401||r.status===403){throw new Error('auth');}
      if(r.status===404){remote=null;rsha=null;}
      else if(!r.ok){throw new Error(await failText(r));}
      else{var j=await r.json();remote=migrate(JSON.parse(b64dec(j.content)));rsha=j.sha;}
      var merged=merge(state,remote);
      var needPush=!remote||!same(merged,remote);
      state=merged;lsSet(LS_STATE,JSON.stringify(state));
      if(!needPush){syncMsg='ok';break;}
      var body={message:'update '+new Date().toISOString(),content:b64enc(JSON.stringify(state,null,1)),branch:BRANCH};
      if(rsha)body.sha=rsha;
      var pr=await api('PUT',body);
      if(pr.status===409||pr.status===422){continue;}
      if(pr.status===401||pr.status===403){throw new Error('auth');}
      if(!pr.ok){throw new Error(await failText(pr));}
      syncMsg='ok';break;
    }
    if(syncMsg==='syncing')syncMsg='fail';
  }catch(e){syncMsg=(e&&e.message==='auth')?'auth':'fail';syncDetail=(e&&e.message)||'';}
  syncing=false;
  if(syncAgain){syncAgain=false;return doSync();}
  render();
}

/* ---------- location ---------- */
function getPos(){
  return new Promise(function(res,rej){
    if(!navigator.geolocation){rej(new Error('nogeo'));return;}
    navigator.geolocation.getCurrentPosition(function(p){res({lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy});},
      function(e){rej(e);},{enableHighAccuracy:true,timeout:10000,maximumAge:60000});
  });
}
function distM(a,b){
  var R=6371000,t=Math.PI/180;
  var dLat=(b.lat-a.lat)*t,dLng=(b.lng-a.lng)*t;
  var x=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(a.lat*t)*Math.cos(b.lat*t)*Math.sin(dLng/2)*Math.sin(dLng/2);
  return 2*R*Math.asin(Math.sqrt(x));
}
function matchPlace(pos){
  var best=null,bd=1e9;
  (state.places||[]).forEach(function(p){var d=distM(pos,p);if(d<bd){bd=d;best=p;}});
  return best&&bd<=200?best:null;
}

/* ---------- actions ---------- */
function removeLog(id){state.logs=state.logs.filter(function(l){return l.id!==id;});state.deleted.push(id);touch(false);render();doSync();}
async function record(items,date){
  busy='📍 正在定位…';render();
  var pos=null;
  try{pos=await getPos();}catch(e){}
  var m=pos?matchPlace(pos):null;
  items.forEach(function(it){
    if(logsFor(date,it.drug).length)return;
    var l={id:uid(),date:date,drug:it.drug,time:it.time};
    if(pos){l.lat=+pos.lat.toFixed(5);l.lng=+pos.lng.toFixed(5);l.place=m?m.name:'';}
    else{l.place=manualPlace;}
    state.logs.push(l);
  });
  busy=pos?'':'⚠️ 没能定位，已用“'+manualPlace+'”记录。请检查浏览器的定位权限。';
  touch(false);render();doSync();
}
function unnamedGroup(){var u=state.logs.filter(function(l){return l.lat!=null&&!l.place;});return u.length?u:null;}

/* ---------- symptoms ---------- */
var SYM=[
 {g:'利奈唑胺相关',items:['手部或脚部麻木、刺痛或针刺感','脚部烧灼样疼痛','身体或肢体无力','视力变化、视物模糊或难以辨别颜色']},
 {g:'贝达喹啉、莫西沙星相关',items:['心悸（感觉心跳过快、过强或不规律）','头晕','晕厥（突然昏倒）']},
 {g:'所有抗结核药',items:['严重恶心或呕吐','进食或饮水困难','眼白或皮肤发黄（黄疸）','严重腹痛','明显的皮疹','发烧或感觉身体非常不适']}
];
function symFor(date){return state.symptoms.filter(function(x){return x.date===date;})[0]||null;}
function symCurrent(date){
  if(symDraft&&symDraft.date===date)return symDraft;
  var s=symFor(date);
  return {date:date,items:s?s.items.slice():[],note:s?s.note||'':''};
}

/* ---------- stats & summary ---------- */
function stats(){
  var elapsed=Math.max(0,Math.min(state.days,dayNo(today))),fullDays=0,streak=0,missed=0,i;
  for(i=0;i<elapsed;i++){if(isFull(addDays(state.start,i)))fullDays++;}
  var cur=today;
  if(!isFull(cur))cur=addDays(cur,-1);
  while(dayNo(cur)>=1&&isFull(cur)){streak++;cur=addDays(cur,-1);}
  for(i=0;i<elapsed-1;i++){if(!isFull(addDays(state.start,i)))missed++;}
  return {fullDays:fullDays,streak:streak,missed:missed};
}
function buildSummary(){
  var n=Math.max(0,Math.min(state.days,dayNo(today)));
  var past=Math.max(0,Math.min(state.days,dayNo(today)-1)); // finished days (before today)
  var lines=[];
  lines.push('服药情况汇总（生成于 '+today+'）');
  lines.push('疗程：'+state.start+' 起，共 '+Math.round(state.days/7)+' 周，预计 '+endDate()+' 结束；今天是第 '+n+' 天（第 '+Math.min(Math.round(state.days/7),Math.floor((Math.max(n,1)-1)/7)+1)+' 周）');
  var due={},took={},missList=[],weekFull={},weekDue={},fullPast=0,i;
  state.drugs.forEach(function(d){due[d.id]=0;took[d.id]=0;});
  for(i=0;i<past;i++){
    var dt=addDays(state.start,i),dd=dueDrugs(dt),w=Math.floor(i/7)+1;
    weekDue[w]=(weekDue[w]||0)+1;
    var all=true;
    dd.forEach(function(d){due[d.id]++;if(logsFor(dt,d.id).length)took[d.id]++;else{all=false;missList.push(dt+' '+d.name);}});
    if(all){fullPast++;weekFull[w]=(weekFull[w]||0)+1;}
  }
  lines.push('');
  lines.push('已过完的 '+past+' 天里：按计划全部吃齐 '+fullPast+' 天，有漏吃的 '+(past-fullPast)+' 天。');
  lines.push('');lines.push('按药统计（已过完的天数内，已吃/应吃）：');
  state.drugs.forEach(function(d){lines.push('- '+d.name+'：'+took[d.id]+'/'+due[d.id]);});
  lines.push('');lines.push('漏吃记录：'+(missList.length?'':'无'));
  var byDate={};missList.forEach(function(x){var p=x.split(' ');(byDate[p[0]]=byDate[p[0]]||[]).push(p[1]);});
  Object.keys(byDate).sort().forEach(function(dt){lines.push('- '+dt+'：'+byDate[dt].join('、'));});
  lines.push('');lines.push('每周吃齐的天数：');
  Object.keys(weekDue).forEach(function(w){lines.push('- 第 '+w+' 周：'+(weekFull[w]||0)+'/'+weekDue[w]+' 天');});
  lines.push('');
  var syms=state.symptoms.filter(function(x){return x.items.length||x.note;}).slice().sort(function(a,b){return cmp(a.date,b.date);});
  lines.push('症状记录：'+(syms.length?'':'无'));
  syms.forEach(function(x){lines.push('- '+x.date+'：'+(x.items.join('；')||'')+(x.note?'（备注：'+x.note+'）':''));});
  lines.push('');
  var ap=state.appts.slice().sort(function(a,b){return cmp(a.date,b.date);});
  lines.push('复诊/检查安排：'+(ap.length?'':'无'));
  ap.forEach(function(x){lines.push('- '+x.date+' '+x.title);});
  lines.push('');lines.push('（以上为本人在手机上的自我记录，仅供复诊时参考。）');
  return lines.join('\n');
}
function csv(){
  var rows=['日期,药名,服药时间,地点,纬度,经度'];
  state.logs.slice().sort(function(a,b){return cmp(a.date+a.time,b.date+b.time);}).forEach(function(l){
    rows.push([l.date,drugName(l.drug),l.time,l.place||'未命名',l.lat==null?'':l.lat,l.lng==null?'':l.lng].map(function(x){return '"'+String(x).replace(/"/g,'""')+'"';}).join(','));
  });
  return rows.join('\n');
}

/* ---------- ui ---------- */
var app=document.getElementById('app');
function el(tag,attrs,kids){
  var e=document.createElement(tag);
  if(attrs){for(var k in attrs){
    if(attrs[k]==null)continue;
    if(k==='class')e.className=attrs[k];
    else if(k==='text')e.textContent=attrs[k];
    else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),attrs[k]);
    else if(k==='value')e.value=attrs[k];
    else e.setAttribute(k,attrs[k]);
  }}
  (kids||[]).forEach(function(c){if(c==null)return;e.appendChild(typeof c==='string'?document.createTextNode(c):c);});
  return e;
}
function hr(){return el('hr',{style:'border:0;border-top:1px solid var(--line);margin:14px 0'});}

function render(){
  var keepOpen=app.querySelector('details')&&app.querySelector('details').open;
  app.innerHTML='';
  var msgs={'ok':'✓ 已同步','syncing':'同步中…','fail':'⏳ 暂时没同步上，稍后会自动重试','auth':'⚠️ 同步密钥无效或已过期，请到“设置”里重新填写','no-token':'⚠️ 还没设置同步密钥，记录只存在这台手机上，提醒功能也不会知道你吃没吃。请到最下面的“设置”里填写。'};
  app.appendChild(el('div',{class:(syncMsg==='auth'||syncMsg==='no-token')?'alert':'sync',text:msgs[syncMsg]||''}));
  if(busy)app.appendChild(el('div',{class:busy.indexOf('⚠️')===0?'alert':'sync',text:busy}));

  var s=stats();
  var n=Math.min(state.days,Math.max(1,dayNo(today)));
  var weeks=Math.round(state.days/7);
  var inRange=dayNo(selDate)>=1&&dayNo(selDate)<=state.days;

  // reminders / notices
  var todaySym=symFor(today);
  if(todaySym&&todaySym.items.length)app.appendChild(el('div',{class:'alert',text:'今天记录了症状。药单上说，出现这些情况请告知结核病医疗团队。'}));
  if(selDate===today){
    var due=dueDrugs(today).filter(function(d){return d.time<=nowHM()&&!logsFor(today,d.id).length;});
    if(due.length)app.appendChild(el('div',{class:'alert',text:'⏰ 该吃了：'+due.map(function(d){return d.name;}).join('、')}));
    state.drugs.forEach(function(d){
      var ph=phaseFor(d,dayNo(today));
      if(ph&&ph.from>1&&ph.from===dayNo(today))app.appendChild(el('div',{class:'info',text:'今天起 '+d.name+' 改为：'+ruleText(d,today)}));
    });
  }
  var upcoming=state.appts.filter(function(x){return x.date===today||x.date===addDays(today,1);});
  upcoming.forEach(function(x){app.appendChild(el('div',{class:'info',text:'📅 '+(x.date===today?'今天':'明天')+'有：'+x.title}));});

  // progress
  app.appendChild(el('div',{class:'card'},[
    el('div',{class:'line'},[el('b',{text:'第 '+n+' / '+state.days+' 天（第 '+Math.min(weeks,Math.floor((n-1)/7)+1)+' / '+weeks+' 周）'})]),
    el('div',{class:'note',style:'margin-bottom:6px',text:'开始 '+state.start+' · 预计 '+endDate()+' 结束'}),
    el('div',{class:'bar'},[el('i',{style:'width:'+Math.round(n/state.days*100)+'%'})]),
    el('div',{class:'stats'},[
      el('div',{class:'stat'},[el('b',{text:String(s.fullDays)}),el('span',{text:'全部吃齐的天数'})]),
      el('div',{class:'stat'},[el('b',{text:String(s.streak)}),el('span',{text:'连续天数'})]),
      el('div',{class:'stat'},[el('b',{class:s.missed?'miss':'',text:String(s.missed)}),el('span',{text:'漏吃的天数'})])
    ])
  ]));

  // unnamed places
  var un=unnamedGroup();
  if(un){
    var first=un[0];
    var nameIn=el('input',{type:'text',placeholder:'给这个地点起名，如：家',style:'flex:1'});
    app.appendChild(el('div',{class:'card'},[
      el('div',{text:'📍 有 '+un.length+' 条记录的地点还没命名（以最近一条为准）。起名后，200 米内的记录会自动归为这个地点。'}),
      el('div',{class:'line',style:'margin-top:8px'},[nameIn,el('button',{class:'small',text:'命名',onclick:function(){
        var nm=nameIn.value.trim();if(!nm)return;
        var ref={lat:first.lat,lng:first.lng};
        state.places=state.places.filter(function(p){return p.name!==nm;});
        state.places.push({name:nm,lat:ref.lat,lng:ref.lng});
        state.logs.forEach(function(l){if(l.lat!=null&&!l.place&&distM(ref,l)<=200)l.place=nm;});
        touch(true);render();doSync();
      }})])
    ]));
  }

  // today card
  var card=el('div',{class:'card'});
  card.appendChild(el('h2',{text:selDate===today?'今天':'补记'}));
  card.appendChild(el('div',{class:'line'},[el('label',{text:'日期'}),el('input',{type:'date',value:selDate,min:state.start,max:today,onchange:function(e){if(e.target.value){selDate=e.target.value;render();}}})]));
  var timeInputs={};
  if(!inRange){card.appendChild(el('div',{class:'note',text:'这一天不在疗程内。'}));}
  state.drugs.forEach(function(d){
    var di=dueInfo(d,selDate),got=logsFor(selDate,d.id)[0];
    if(!di&&!got){
      if(inRange)card.appendChild(el('div',{class:'row off'},[el('div',{class:'name'},[d.name,el('small',{text:'今天不用吃（'+ruleText(d,addDays(state.start,Math.max(0,dayNo(selDate)-1)))+'）'})])]));
      return;
    }
    var row=el('div',{class:'row'});
    row.appendChild(el('div',{class:'name'},[d.name,el('small',{text:'计划 '+d.time+(di?' · '+di.dose:'')})]));
    if(got){
      row.appendChild(el('span',{class:'done',text:'✓ '+got.time+' · '+(got.place||'📍未命名')}));
      row.appendChild(el('button',{class:'ghost small',text:'撤销',onclick:function(){removeLog(got.id);}}));
    }else{
      var t=el('input',{type:'time',value:selDate===today?nowHM():d.time});
      timeInputs[d.id]=t;
      row.appendChild(t);
      row.appendChild(el('button',{class:'small',text:'已吃',disabled:busy.indexOf('定位中')>=0?'disabled':null,onclick:function(){record([{drug:d.id,time:t.value||nowHM()}],selDate);}}));
    }
    card.appendChild(row);
  });
  var pending=dueDrugs(selDate).filter(function(d){return !logsFor(selDate,d.id).length;});
  if(pending.length>0){
    card.appendChild(el('button',{class:'big',text:'已服药（今日不再提醒）',disabled:busy.indexOf('定位中')>=0?'disabled':null,onclick:function(){
      record(pending.map(function(d){return {drug:d.id,time:timeInputs[d.id].value||nowHM()};}),selDate);
    }}));
  }
  card.appendChild(el('div',{class:'note',style:'margin-top:10px',text:'药单提醒：每天固定时间、随食物一起服用；服药后不久呕吐，请告知结核病医疗团队。'}));
  card.appendChild(el('div',{class:'note',style:'margin-top:8px',text:'点“已吃”时会自动读取定位。定位失败时用这个地点：'}));
  var chips=el('div',{class:'chips'});
  var names=state.places.map(function(p){return p.name;});
  if(names.indexOf(manualPlace)<0)names.unshift(manualPlace);
  names.forEach(function(p){chips.appendChild(el('span',{class:'chip'+(p===manualPlace?' on':''),text:p,onclick:function(){manualPlace=p;lsSet(LS_MANUAL,p);render();}}));});
  card.appendChild(chips);
  app.appendChild(card);

  // symptoms
  var sc=symCurrent(selDate);
  var saved=symFor(selDate);
  var scard=el('div',{class:'card sym'});
  scard.appendChild(el('h2',{text:(selDate===today?'今天':selDate)+'有不舒服吗？'}));
  scard.appendChild(el('div',{class:'note',text:'下面是药单上列的症状。都没有就不用勾，直接点保存。'}));
  SYM.forEach(function(g){
    scard.appendChild(el('h4',{text:g.g}));
    g.items.forEach(function(it){
      var cb=el('input',{type:'checkbox',onchange:function(e){
        var cur=symCurrent(selDate);var idx=cur.items.indexOf(it);
        if(e.target.checked&&idx<0)cur.items.push(it);
        if(!e.target.checked&&idx>=0)cur.items.splice(idx,1);
        symDraft=cur;
      }});
      if(sc.items.indexOf(it)>=0)cb.checked=true;
      scard.appendChild(el('label',{},[cb,it]));
    });
  });
  var noteIn=el('input',{type:'text',placeholder:'备注（可不填）',value:sc.note,style:'width:100%;margin-top:8px',oninput:function(e){var cur=symCurrent(selDate);cur.note=e.target.value;symDraft=cur;}});
  scard.appendChild(noteIn);
  scard.appendChild(el('button',{class:'big',text:saved?'更新这天的症状记录':'保存症状记录',onclick:function(){
    var cur=symCurrent(selDate);
    var rec={id:'s'+selDate,date:selDate,items:cur.items.slice(),note:cur.note||'',updatedAt:Date.now()};
    state.symptoms=state.symptoms.filter(function(x){return x.date!==selDate;});
    state.symptoms.push(rec);symDraft=null;touch(false);render();doSync();
  }}));
  if(saved)scard.appendChild(el('div',{class:'note',style:'margin-top:8px',text:saved.items.length?'✓ 已记录 '+saved.items.length+' 项。药单上说，出现这些情况请告知结核病医疗团队。':'✓ 已记录：这天没有不适'}));
  app.appendChild(scard);

  // appointments
  var acard=el('div',{class:'card'});
  acard.appendChild(el('h2',{text:'复诊 / 检查安排'}));
  var ap=state.appts.slice().sort(function(a,b){return cmp(a.date,b.date);});
  if(!ap.length)acard.appendChild(el('div',{class:'note',text:'还没有安排。药单上说治疗期间要定期抽血和做心电图，日期定了就填在这里，我会在前一天和当天早上提醒。'}));
  ap.forEach(function(x){
    acard.appendChild(el('div',{class:'appt'+(x.date<today?' past':'')},[el('span',{text:x.date+'（周'+WDN[wdOf(x.date)]+'） '+x.title}),el('button',{text:'×',title:'删除',onclick:function(){
      state.appts=state.appts.filter(function(y){return y.id!==x.id;});state.deleted.push(x.id);touch(false);render();doSync();}})]));
  });
  var aDate=el('input',{type:'date',value:addDays(today,1),min:today});
  var aType=el('select',{},['抽血','心电图','复诊','其他'].map(function(t){return el('option',{value:t,text:t});}));
  acard.appendChild(el('div',{class:'line',style:'margin-top:10px'},[aDate,aType,el('button',{class:'small',text:'添加',onclick:function(){
    if(!aDate.value)return;
    state.appts.push({id:uid(),date:aDate.value,title:aType.value});touch(false);render();doSync();
  }})]));
  app.appendChild(acard);

  // history
  var hist=el('div',{class:'card'});
  hist.appendChild(el('h2',{text:'历史记录'}));
  var list=[],seen={};
  var elapsed=Math.max(1,Math.min(state.days,dayNo(today)));
  for(var i=0;i<elapsed;i++){var dd=addDays(state.start,i);list.push(dd);seen[dd]=1;}
  state.logs.forEach(function(l){if(!seen[l.date]){seen[l.date]=1;list.push(l.date);}});
  list.sort().reverse();
  if(!state.logs.length)hist.appendChild(el('div',{class:'note',text:'还没有记录。'}));
  list.forEach(function(date){
    var ls_=logsFor(date).sort(function(a,b){return cmp(a.time,b.time);});
    if(!ls_.length&&date===today)return;
    var full=isFull(date),dueN=dueDrugs(date).length;
    var day=el('div',{class:'day'});
    day.appendChild(el('h3',{},[date+(date===today?'（今天）':''),el('em',{class:full?'done':'miss',text:full?'✓ 吃齐':(ls_.length+'/'+dueN)})]));
    ls_.forEach(function(l){
      day.appendChild(el('div',{class:'dose'},[
        el('span',{text:l.time+'  '+drugName(l.drug)+' · '+(l.place||'📍未命名')}),
        el('button',{text:'×',title:'删除',onclick:function(){removeLog(l.id);}})
      ]));
    });
    var sy=symFor(date);
    if(sy&&(sy.items.length||sy.note))day.appendChild(el('div',{class:'dose'},[el('span',{class:'miss',text:'症状：'+sy.items.join('；')+(sy.note?'（'+sy.note+'）':'')})]));
    hist.appendChild(day);
  });
  app.appendChild(hist);

  // doctor summary
  var scd=el('div',{class:'card'});
  scd.appendChild(el('h2',{text:'给医生看的汇总'}));
  var sta=el('textarea',{readonly:'readonly',style:'height:220px'});
  sta.value=summaryText;
  scd.appendChild(el('div',{class:'line'},[
    el('button',{text:'生成汇总',onclick:function(){summaryText=buildSummary();render();}}),
    summaryText?el('button',{class:'ghost',text:'复制',onclick:function(){try{navigator.clipboard.writeText(summaryText).catch(function(){sta.select();});}catch(e){sta.select();}}}):null
  ]));
  if(summaryText)scd.appendChild(sta);
  app.appendChild(scd);

  // settings
  var det=el('details');
  if(keepOpen||syncMsg==='no-token'||syncMsg==='auth')det.open=true;
  det.appendChild(el('summary',{text:'设置 / 导出'}));
  det.appendChild(el('p',{class:'note',text:'1) 每天吃药的时间（提醒按这里的时间算）。剂量和服用规则按药单设置，医生调整后请告诉我。'}));
  var nameIn2={},timeIn={};
  state.drugs.forEach(function(d){
    nameIn2[d.id]=el('input',{type:'text',value:d.name,style:'width:110px'});
    timeIn[d.id]=el('input',{type:'time',value:d.time});
    det.appendChild(el('div',{class:'line'},[nameIn2[d.id],timeIn[d.id]]));
  });
  var startIn=el('input',{type:'date',value:state.start});
  var daysIn=el('input',{type:'text',value:String(state.days),style:'width:70px',inputmode:'numeric'});
  det.appendChild(el('div',{class:'line'},[el('label',{text:'开始吃药的日期'}),startIn]));
  det.appendChild(el('div',{class:'line'},[el('label',{text:'疗程天数（26 周 = 182 天）'}),daysIn]));
  det.appendChild(el('button',{text:'保存设置',onclick:function(){
    state.drugs.forEach(function(d){d.name=nameIn2[d.id].value.trim()||d.name;d.time=timeIn[d.id].value||d.time;});
    if(startIn.value)state.start=startIn.value;
    var nn=parseInt(daysIn.value,10);if(nn>0&&nn<=730)state.days=nn;
    touch(true);render();doSync();
  }}));

  det.appendChild(hr());
  det.appendChild(el('p',{class:'note',text:'2) 把现在所在的位置存为常用地点（在家时存“家”，在 ACE 时存“ACE”）'}));
  var plIn=el('input',{type:'text',placeholder:'地点名称',style:'width:140px'});
  det.appendChild(el('div',{class:'line'},[plIn,el('button',{class:'ghost small',text:'存当前位置',onclick:async function(){
    var nm=plIn.value.trim();if(!nm)return;
    busy='📍 正在定位…';render();
    try{
      var p=await getPos();
      state.places=state.places.filter(function(x){return x.name!==nm;});
      state.places.push({name:nm,lat:+p.lat.toFixed(5),lng:+p.lng.toFixed(5)});
      busy='✓ 已保存“'+nm+'”';touch(true);doSync();
    }catch(e){busy='⚠️ 没能定位，请检查浏览器的定位权限。';}
    render();
  }})]));
  if(state.places.length)det.appendChild(el('div',{class:'note',text:'已存：'+state.places.map(function(p){return p.name;}).join('、')}));

  det.appendChild(hr());
  det.appendChild(el('p',{class:'note',text:'3) 同步密钥（让记录保存到你的私有仓库，并让手机提醒知道你吃没吃）'}));
  var tkIn=el('input',{type:'password',placeholder:token?'已设置（重新粘贴可替换）':'粘贴密钥',style:'flex:1;min-width:0'});
  det.appendChild(el('div',{class:'line'},[tkIn,el('button',{class:'small',text:'保存密钥',onclick:function(){
    var v=tkIn.value.trim();if(!v)return;
    token=v;lsSet(LS_TOKEN,v);syncMsg='syncing';syncDetail='';render();doSync();
  }})]));
  det.appendChild(el('div',{class:'line'},[el('button',{class:'ghost small',text:'立即同步',onclick:function(){doSync();}})]));
  var stTxt=msgs[syncMsg]||'还没有同步过';
  if(syncDetail&&syncMsg==='fail')stTxt+='（'+syncDetail+'。如果是 404，说明密钥没有选到 pill-data 仓库；如果是 403，说明权限不是 Read and write）';
  det.appendChild(el('div',{class:syncMsg==='ok'?'done':'note',style:'margin-bottom:8px',text:'同步状态：'+stTxt}));

  det.appendChild(hr());
  var ta=el('textarea',{readonly:'readonly'});ta.value=csv();
  det.appendChild(el('div',{class:'line'},[
    el('button',{class:'ghost',text:'下载 CSV',onclick:function(){
      try{
        var b=new Blob(['﻿'+csv()],{type:'text/csv;charset=utf-8'});
        var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='服药记录.csv';document.body.appendChild(a);a.click();a.remove();
      }catch(e){ta.select();}
    }}),
    el('button',{class:'ghost',text:'复制全部记录',onclick:function(){
      try{navigator.clipboard.writeText(csv()).catch(function(){ta.select();});}catch(e){ta.select();}
    }})
  ]));
  det.appendChild(ta);
  app.appendChild(el('div',{class:'card'},[det]));
}

render();
doSync();
document.addEventListener('visibilitychange',function(){
  if(!document.hidden){today=ymd(new Date());doSync();}
});
setInterval(function(){
  var ae=document.activeElement;
  if(selDate===today&&!document.hidden&&!(ae&&(ae.tagName==='INPUT'||ae.tagName==='SELECT')))render();
},60000);
})();
</script>
</body>
</html>
